/* ═══════════════════════════════════════════════════════════════════════════
   MARKET STRUCTURE
   Swings are found with a symmetric fractal rule, then Higher High / Higher
   Low / Lower High / Lower Low, Break of Structure (a close beyond the last
   opposing swing) and Change of Character (a break against the established
   bias). This is the same thing a trader draws by hand — the point is that the
   user can verify what the engine claims.
   ═══════════════════════════════════════════════════════════════════════════ */
function findSwings(c,k){
  k=k||3; const out=[];
  for(let i=k;i<c.length-k;i++){
    let hi=true,lo=true;
    for(let j=i-k;j<=i+k;j++){
      if(j===i)continue;
      if(c[j].h>=c[i].h)hi=false;
      if(c[j].l<=c[i].l)lo=false;
      if(!hi&&!lo)break;
    }
    if(hi)out.push({i:i,t:c[i].t,price:c[i].h,kind:"high"});
    else if(lo)out.push({i:i,t:c[i].t,price:c[i].l,kind:"low"});
  }
  return out;
}
function analyseStructure(c,tf){
  const empty={tf:tf,bias:"neutral",hh:false,hl:false,lh:false,ll:false,bos:null,choch:null,
    state:"undefined",swingHigh:null,swingLow:null,strength:0};
  if(c.length<22)return empty;
  const sw=findSwings(c,3);
  const highs=sw.filter(s=>s.kind==="high").slice(-2), lows=sw.filter(s=>s.kind==="low").slice(-2);
  if(highs.length<2||lows.length<2)return empty;
  const ph=highs[0],lh_=highs[1],pl=lows[0],ll_=lows[1];
  const hh=lh_.price>ph.price, lh=lh_.price<ph.price, hl=ll_.price>pl.price, ll=ll_.price<pl.price;
  const close=c[c.length-1].c;
  const a=atr(c,14), an=a[a.length-1]||close*.005;

  let bos=null;
  if(close>lh_.price)bos="bullish"; else if(close<ll_.price)bos="bearish";
  const prior=(hh&&hl)?"bullish":(lh&&ll)?"bearish":"neutral";
  let choch=null;
  if(bos==="bullish"&&prior==="bearish")choch="bullish";
  if(bos==="bearish"&&prior==="bullish")choch="bearish";

  const win=c.slice(-20);
  const rHi=Math.max.apply(null,win.map(x=>x.h)), rLo=Math.min.apply(null,win.map(x=>x.l));
  const consolidating=((rHi-rLo)/(an||1))<3.2;

  let bias=prior;
  if(choch)bias=choch; else if(bias==="neutral"&&bos)bias=bos;
  let state="undefined";
  if(consolidating)state="consolidation";
  else if(choch)state="potential-reversal";
  else if(bias!=="neutral")state="trend-continuation";

  /* A change of character is the one case where the swing sequence is actively
     misleading — the sequence that produced the prior bias is exactly what has
     just been invalidated — so it is heavily discounted and the new direction
     leads. Otherwise bias and strength tell the user two different stories. */
  const seqW=choch?.3:1;
  let s=0;
  if(hh)s+=.3*seqW; if(hl)s+=.3*seqW; if(lh)s-=.3*seqW; if(ll)s-=.3*seqW;
  if(bos==="bullish")s+=.3; if(bos==="bearish")s-=.3;
  if(choch==="bullish")s+=.35; if(choch==="bearish")s-=.35;
  s+=clamp((close-(lh_.price+ll_.price)/2)/(an*4||1),-.15,.15);
  if(consolidating)s*=.55;

  return{tf:tf,bias:bias,hh:hh,hl:hl,lh:lh,ll:ll,bos:bos,choch:choch,state:state,
    swingHigh:lh_.price,swingLow:ll_.price,strength:clamp(s,-1,1)};
}

/* ── technical trend + momentum per timeframe ──────────────────────────── */
function slopeOf(ser,back,ref){
  const n=ser.length, a=ser[n-1], b=ser[n-1-back];
  if(a==null||b==null||!ref)return{dir:null,pct:0};
  const pct=((a-b)/ref)*100;
  return{dir:pct>.08?"rising":pct<-.08?"falling":"flat",pct:pct};
}
function analyseTechnical(c,tf){
  const cl=c.map(x=>x.c), price=cl[cl.length-1];
  const m50=sma(cl,50), m200=sma(cl,200);
  const ma50=m50[m50.length-1], ma200=m200[m200.length-1];
  const at=atr(c,14), an=at[at.length-1];
  const s50=slopeOf(m50,Math.min(10,c.length-1),price), s200=slopeOf(m200,Math.min(20,c.length-1),price);
  const hist=at.filter(v=>v!=null).slice(-120);
  const avg=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length:null;
  const ratio=(an!=null&&avg)?an/avg:1;
  const volatility=ratio>1.6?"high":ratio>1.2?"elevated":ratio<.75?"low":"normal";

  let s=0;
  if(ma50!=null)s+=price>ma50?.28:-.28;
  if(ma200!=null)s+=price>ma200?.22:-.22;
  if(ma50!=null&&ma200!=null)s+=ma50>ma200?.12:-.12;
  s+=clamp(s50.pct*.35,-.22,.22);
  s+=clamp(s200.pct*.25,-.16,.16);
  /* Being extremely extended from the 50 MA is a mild caution, not a reversal call. */
  if(ma50!=null&&an){const ext=(price-ma50)/an;if(Math.abs(ext)>4)s-=Math.sign(ext)*.08}
  s=clamp(s,-1,1);
  return{tf:tf,price:price,ma50:ma50==null?null:ma50,ma200:ma200==null?null:ma200,
    vs50:ma50!=null?(price>ma50?"above":"below"):null,vs200:ma200!=null?(price>ma200?"above":"below"):null,
    slope50:s50.dir,slope200:s200.dir,trend:s>.2?"bullish":s<-.2?"bearish":"neutral",
    strength:s,atr:an==null?null:an,atrPct:(an!=null&&price)?(an/price)*100:null,volatility:volatility};
}
function analyseMomentum(c,tf){
  const cl=c.map(x=>x.c);
  const r=rsi(cl,14), rn=r[r.length-1];
  const m=macd(cl), hist=m.hist[m.hist.length-1], line=m.macd[m.macd.length-1], sig=m.signal[m.signal.length-1];
  const ro=roc(cl,10), rocN=ro[ro.length-1];
  const vols=c.slice(-40).map(x=>x.v);
  const va=vols.length?vols.reduce((a,b)=>a+b,0)/vols.length:0;
  const volRatio=va?c[c.length-1].v/va:null;
  const state=(line==null||sig==null)?null:(line>sig&&(hist||0)>0)?"bullish":(line<sig&&(hist||0)<0)?"bearish":"flat";
  let s=0;
  if(rn!=null)s+=clamp((rn-50)/30,-1,1)*.4;
  if(hist!=null)s+=squash(hist/(cl[cl.length-1]*.0015||1),2)*.35;
  if(rocN!=null)s+=squash(rocN,4)*.25;
  /* Volume confirms the move it accompanies; it never sets direction alone. */
  if(volRatio!=null&&volRatio>1.25)s*=1.12;
  if(volRatio!=null&&volRatio<.7)s*=.88;
  return{tf:tf,rsi:rn==null?null:rn,macdHist:hist==null?null:hist,macdState:state,
    roc:rocN==null?null:rocN,volumeVsAvg:volRatio,strength:clamp(s,-1,1)};
}

/* ── news → this market ────────────────────────────────────────────────── */
const IMPACT_W={low:.35,medium:.7,high:1};
function relevanceFor(asset,article){
  const beta=asset.news[article.theme];
  const named=article.symbols.some(s=>s.toUpperCase()===asset.symbol.toUpperCase());
  if(beta===undefined&&!named)return null;
  const rel0=beta===undefined?(named?.6:0):beta;
  const relevance=clamp(Math.abs(rel0)*(named?1.15:1),0,1);
  if(relevance<.1)return null;
  const eff=clamp(article.sentiment*rel0,-1,1);
  const dir=eff>.12?"supportive of":eff<-.12?"a headwind for":"broadly neutral for";
  const str=Math.abs(rel0)>.7?"strongly":Math.abs(rel0)>.4?"moderately":"loosely";
  return{article:article,relevance:relevance,effect:eff,
    reason:asset.symbol+" is "+str+" linked to this theme, which makes the story "+dir+" it. This is a typical relationship, not a rule."};
}
function analyseNews(asset,articles,now){
  const items=[]; let weighted=0,total=0;
  articles.forEach(a=>{
    const r=relevanceFor(asset,a); if(!r)return;
    const age=Math.max(0,(now-a.publishedAt)/HOUR);
    const decay=Math.pow(.5,age/20);
    const w=r.relevance*IMPACT_W[a.impact]*decay;
    weighted+=r.effect*w; total+=w; r._w=w; items.push(r);
  });
  items.sort((a,b)=>b._w-a._w);
  if(total<.25)return{strength:0,items:items.slice(0,8),evidence:[],available:false};
  const conf=clamp(total/3,.35,1);
  const strength=clamp((weighted/total)*conf,-1,1);
  return{strength:strength,items:items.slice(0,12),available:true,
    evidence:items.slice(0,4).map(r=>({label:r.article.headline,detail:r.reason,impact:r.effect}))};
}

/* ── macro → this market ───────────────────────────────────────────────── */
const FACTOR_LABEL={dollar:"US dollar",realYields:"Real yields",riskAppetite:"Risk appetite",
  inflation:"Inflation",growth:"Growth",rates:"Rate expectations"};
function analyseMacro(asset,macro){
  const f={dollar:macro.dollar,realYields:macro.realYields,riskAppetite:macro.riskAppetite,
    inflation:macro.inflation,growth:macro.growth,rates:macro.policyStance};
  let weighted=0,total=0; const contrib=[];
  Object.keys(f).forEach(k=>{
    const beta=asset.macro[k]; if(!beta)return;
    const v=beta*f[k]; weighted+=v; total+=Math.abs(beta); contrib.push({k:k,v:v,f:f[k],beta:beta});
  });
  if(!total)return{strength:0,drivers:[],available:false};
  contrib.sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  return{strength:clamp(weighted/total,-1,1),available:true,
    drivers:contrib.slice(0,4).map(c=>{
      const fw=c.f>.15?"rising":c.f<-.15?"easing":"broadly stable";
      const eff=c.v>.08?"supportive":c.v<-.08?"a headwind":"neutral";
      return{label:FACTOR_LABEL[c.k],impact:clamp(c.v,-1,1),
        detail:FACTOR_LABEL[c.k]+" is "+fw+". "+asset.symbol+" typically moves "+(c.beta>0?"with":"against")+" this factor, so the current setting is "+eff+"."};
    })};
}

/* ── event risk ────────────────────────────────────────────────────────────
   Event risk does NOT push a market bearish. It reduces conviction in whichever
   direction the rest of the evidence points, because a scheduled binary event
   can resolve either way. It is also contextual: only assets actually exposed
   to a release are affected, so one print never punishes every market.        */
function analyseEventRisk(asset,events,now){
  const tags=new Set(asset.tags), ccy=new Set(asset.ccy);
  const rel=events.filter(e=>e.time>now)
    .filter(e=>e.tags.some(t=>tags.has(t))||ccy.has(e.ccy)).sort((a,b)=>a.time-b.time);
  if(!rel.length)return{next:null,hoursUntil:null,risk:"none",damp:0,upcoming:[]};
  let damp=0;
  rel.forEach(e=>{
    const hrs=(e.time-now)/HOUR; if(hrs>EVENT_RISK.horizon)return;
    const prox=Math.pow(1-hrs/EVENT_RISK.horizon,1.6);
    const exposure=e.tags.some(t=>tags.has(t))?1:.6;
    damp=Math.max(damp,EVENT_RISK.impact[e.importance]*prox*exposure);
  });
  damp=clamp(damp*EVENT_RISK.maxDamp,0,1);
  const next=rel[0];
  return{next:next,hoursUntil:(next.time-now)/HOUR,damp:damp,upcoming:rel.slice(0,6),
    risk:damp>.45?"high":damp>.18?"medium":damp>.04?"low":"none"};
}

/* ── cross-market confirmation ─────────────────────────────────────────────
   Relationships are supporting evidence, never rules. The related market's own
   PRICE-derived bias is used (no recursion into news or macro, which would
   double-count) and the sign of the relationship is applied.                  */
const biasCache=new Map();
function trendBias(symbol){
  if(biasCache.has(symbol))return biasCache.get(symbol);
  const a=getAsset(symbol); if(!a){biasCache.set(symbol,null);return null}
  const d=series(a,"1D"), f=series(a,"4H");
  const t=analyseTechnical(d,"1D"), s=analyseStructure(d,"1D"), t4=analyseTechnical(f,"4H");
  const v=clamp(t.strength*.45+s.strength*.35+t4.strength*.2,-1,1);
  biasCache.set(symbol,v); return v;
}
function analyseCross(asset){
  if(!asset.rel.length)return{strength:0,readings:[],evidence:[],available:false};
  const readings=[]; let weighted=0,total=0;
  asset.rel.forEach(link=>{
    const rel=getAsset(link.symbol), b=trendBias(link.symbol);
    if(b===null||!rel)return;
    const conf=clamp(b*link.sign,-1,1);
    readings.push({symbol:link.symbol,name:rel.name,label:link.label,sign:link.sign,bias:b,confirmation:conf});
    weighted+=conf*link.weight; total+=link.weight;
  });
  if(!total)return{strength:0,readings:readings,evidence:[],available:false};
  const sorted=readings.slice().sort((a,b)=>Math.abs(b.confirmation)-Math.abs(a.confirmation));
  return{strength:clamp(weighted/total,-1,1),readings:readings,available:true,
    evidence:sorted.slice(0,3).map(r=>({label:r.symbol+" — "+r.label,impact:r.confirmation,
      detail:r.symbol+" is currently "+(r.bias>.15?"bullish":r.bias<-.15?"bearish":"flat")+" and moves "+(r.sign===1?"with":"against")+" "+asset.symbol+", so it is "+(r.confirmation>.1?"confirming":r.confirmation<-.1?"contradicting":"neutral for")+" the current read."}))};
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE MD DIRECTION SCORE

   Each category gives a signed strength in -1..+1. Multiplied by its weight it
   contributes signed POINTS in ±weight. The sum is a raw value in ±100:

       score = 50 + rawPoints / 2

   so a market with NO directional evidence sits at 50 ("Mixed / Neutral") and
   perfect alignment reaches 0 or 100. The score measures EVIDENCE ALIGNMENT.
   It is not a probability and is never presented as one.
   ═══════════════════════════════════════════════════════════════════════════ */
function weightByMode(items,mode){
  const w=MODES[mode].w; let s=0,t=0;
  items.forEach(it=>{const k=w[it.tf]||0;if(!k)return;s+=it.strength*k;t+=k});
  return t?clamp(s/t,-1,1):0;
}
const HTF=["1W","1D","4H"],LTF=["1H","15M","5M"];
const HTF_W={"1W":3,"1D":2.5,"4H":1.5},LTF_W={"1H":2,"15M":1.5,"5M":1};
function groupStrength(items,group,w){
  let s=0,t=0;
  items.forEach(it=>{if(group.indexOf(it.tf)<0)return;const k=w[it.tf]||1;s+=it.strength*k;t+=k});
  return t?clamp(s/t,-1,1):null;
}
const toDir=v=>v>.18?"bullish":v<-.18?"bearish":"neutral";

/* CONFLICT DETECTION — two kinds of disagreement matter:
   1. higher vs lower timeframes ("the weekly says up, the hourly says down")
   2. disagreement WITHIN the higher timeframes — a bullish weekly against a
      bearish daily is not a clean trend, even though the group average looks
      positive. Calling that "strong alignment" would be wrong.               */
function detectConflict(combined){
  const h=groupStrength(combined,HTF,HTF_W), l=groupStrength(combined,LTF,LTF_W);
  if(h===null||l===null)return{conflicted:false,higher:"neutral",lower:"neutral",message:null};
  const hd=toDir(h), ld=toDir(l);
  if(hd!=="neutral"&&ld!=="neutral"&&hd!==ld)
    return{conflicted:true,higher:hd,lower:ld,
      message:"Higher timeframes remain "+hd+", but short-term structure has turned "+ld+"."};
  const strong=combined.filter(c=>HTF.indexOf(c.tf)>=0&&Math.abs(c.strength)>.35);
  const bulls=strong.filter(c=>c.strength>0), bears=strong.filter(c=>c.strength<0);
  if(bulls.length&&bears.length)
    return{conflicted:true,higher:hd,lower:ld,
      message:"Higher timeframes disagree with each other — "+bulls.map(c=>c.tf).join(" and ")+" bullish against "+bears.map(c=>c.tf).join(" and ")+" bearish."};
  return{conflicted:false,higher:hd,lower:ld,message:null};
}

function buildScore(cats,conflict,eventDamp,notes){
  const byKey=new Map(cats.map(c=>[c.key,c]));
  const directional=CAT_ORDER.filter(k=>k!=="eventRisk");
  let raw=0,availW=0,totalW=0; const results=[];
  directional.forEach(key=>{
    const input=byKey.get(key), weight=WEIGHTS[key];
    totalW+=weight;
    const rawS=(input&&input.available)?clamp(input.strength,-1,1):0;
    const s=calibrate(key,rawS);
    if(input&&input.available)availW+=weight;
    const points=s*weight; raw+=points;
    results.push({key:key,label:CAT_LABEL[key],strength:s,weight:weight,points:points,
      fill:(s+1)/2,available:!!(input&&input.available),
      evidence:(input&&input.evidence)||[],summary:(input&&input.summary)||"Data unavailable."});
  });
  /* Event risk pulls conviction TOWARD NEUTRAL, in whichever direction the rest
     of the evidence points. It never flips a market bearish on its own. */
  const ew=WEIGHTS.eventRisk; totalW+=ew;
  const sign=raw===0?0:Math.sign(raw);
  const ePoints=-Math.abs(eventDamp)*ew*sign;
  const eIn=byKey.get("eventRisk");
  if(eventDamp>0)availW+=ew;
  raw+=ePoints;
  results.push({key:"eventRisk",label:CAT_LABEL.eventRisk,strength:-eventDamp,weight:ew,points:ePoints,
    fill:1-eventDamp,available:!!((eIn&&eIn.available)||eventDamp>0),evidence:(eIn&&eIn.evidence)||[],
    summary:(eIn&&eIn.summary)||"No scheduled event risk detected for this market."});

  if(conflict.conflicted)raw*=1-CONFLICT_DAMP;

  const score=clamp(Math.round(50+raw/2),0,100);
  const band=bandFor(score);
  const direction=conflict.conflicted?"mixed":band.dir;
  const coverage=totalW?availW/totalW:0;
  const availCount=results.filter(r=>r.available).length;
  const reasons=[availCount+"/"+results.length+" evidence categories available"].concat(notes||[]);
  if(conflict.conflicted)reasons.push("Timeframes disagree — conviction reduced");
  const quality=(coverage>=.85&&!conflict.conflicted)?"high":coverage>=.6?"medium":"low";
  return{score:score,direction:direction,label:conflict.conflicted?"Mixed — timeframes disagree":band.label,
    categories:results,rawPoints:raw,quality:quality,qualityReasons:reasons,conflict:conflict};
}

/* ── plain-English explanation ─────────────────────────────────────────────
   Runs with no AI provider. Observations are sorted into those that SUPPORT
   the read and those that ARGUE AGAINST it, so the explanation never lists
   contradictory facts as if they all pointed the same way.                    */
function dirWord(d){return d==="bullish"?"a bullish directional bias":d==="bearish"?"a bearish directional bias":d==="mixed"?"a mixed picture":"no clear directional bias"}
function buildWhy(asset,score,tech,struct,ev){
  const parts=[], bullish=score.direction==="bullish", bearish=score.direction==="bearish";
  parts.push(asset.name+" currently shows "+dirWord(score.direction)+" with an MD Direction Score of "+score.score+" — "+score.label.toLowerCase()+".");
  const sup=[],opp=[];
  const agrees=p=>bullish?p:bearish?!p:null;
  const push=(p,text)=>{const side=agrees(p);if(side===null)(p?sup:opp).push(text);else (side?sup:opp).push(text)};
  const d=tech.find(t=>t.tf==="1D");
  if(d&&d.ma50!=null&&d.vs50){
    push(d.vs50==="above","price is "+d.vs50+" its 50 MA on the daily chart");
    if(d.slope50&&d.slope50!=="flat")push(d.slope50==="rising","the daily 50 MA is "+d.slope50);
  }
  ["1W","1D","4H"].forEach(tf=>{
    const st=struct.find(x=>x.tf===tf);
    if(st&&st.bias!=="neutral")push(st.bias==="bullish",(tf==="1W"?"weekly":tf==="1D"?"daily":"4H")+" market structure is "+st.bias);
  });
  score.categories.forEach(c=>{
    if(!c.available||c.key==="eventRisk"||c.key==="technical"||c.key==="structure")return;
    if(Math.abs(c.strength)<.12)return;
    push(c.points>0,c.label.toLowerCase()+" is "+(c.points>0?"supportive":"a headwind"));
  });
  if(sup.length)parts.push((score.direction==="neutral"||score.direction==="mixed")
    ?"On the supportive side, "+sup.slice(0,4).join(", ")+"."
    :"This is because "+sup.slice(0,4).join(", ")+".");
  if(opp.length)parts.push("Working against it, "+opp.slice(0,3).join(", ")+" — which is why the score is not higher.");
  if(score.conflict.conflicted&&score.conflict.message)
    parts.push(score.conflict.message+" That disagreement is why this is not treated as strong alignment.");
  if(ev.next&&ev.hoursUntil!=null&&ev.risk!=="none")
    parts.push("The main near-term risk is "+ev.next.name+" in about "+Math.round(ev.hoursUntil)+" hours, which can create volatility in either direction.");
  parts.push("This is an assessment of current evidence alignment, not a forecast or a probability of any outcome.");
  return parts.join(" ");
}
function buildTriggers(asset,score,tech,struct,ev){
  const out=[], d=tech.find(t=>t.tf==="1D"), ds=struct.find(s=>s.tf==="1D");
  if(d&&d.ma50!=null)out.push("A daily close "+(d.vs50==="above"?"back below":"back above")+" the 50 MA at "+fmt(d.ma50,asset.prec)+".");
  if(ds&&ds.swingLow!=null&&ds.swingHigh!=null)
    out.push(score.direction==="bearish"
      ?"A break above the last daily swing high at "+fmt(ds.swingHigh,asset.prec)+" would flip daily structure."
      :"A break below the last daily swing low at "+fmt(ds.swingLow,asset.prec)+" would flip daily structure.");
  if(ev.next)out.push(ev.next.name+" ("+ev.next.importance+" impact) — a surprise in either direction can reset the read.");
  const mc=score.categories.find(c=>c.key==="macro");
  if(mc&&mc.available&&mc.evidence[0])out.push("A change in "+mc.evidence[0].label.toLowerCase()+" would change the macro contribution.");
  if(score.conflict.conflicted)out.push("Lower timeframes realigning with the higher timeframes would remove the conflict penalty.");
  return out.slice(0,5);
}

/* ── full analysis for one market ──────────────────────────────────────── */
const BARS_PER_DAY={"5M":288,"15M":96,"1H":24,"4H":6,"1D":1,"1W":0};
function truncate(c,tf){const drop=BARS_PER_DAY[tf];if(!drop||c.length-drop<60)return c;return c.slice(0,c.length-drop)}
function readCore(ser){
  const tech=[],struct=[],momo=[];
  TFS.forEach(tf=>{
    const c=ser[tf]; if(!c||c.length<30)return;
    tech.push(analyseTechnical(c,tf)); struct.push(analyseStructure(c,tf)); momo.push(analyseMomentum(c,tf));
  });
  return{tech:tech,struct:struct,momo:momo};
}
function summarise(s,extra){
  const w=s>.35?"clearly bullish":s>.12?"mildly bullish":s<-.35?"clearly bearish":s<-.12?"mildly bearish":"neutral";
  return extra?w+" — "+extra:w;
}
function assemble(mode,core,news,macro,cross,eventDamp){
  const t=weightByMode(core.tech,mode), st=weightByMode(core.struct,mode), mo=weightByMode(core.momo,mode);
  const combined=core.tech.map(x=>{
    const s=core.struct.find(y=>y.tf===x.tf);
    return{tf:x.tf,strength:clamp(x.strength*.5+((s&&s.strength)||0)*.5,-1,1)};
  });
  const conflict=detectConflict(combined);
  const big=["1W","1D","4H","1H"];
  const cats=[
    {key:"technical",strength:t,available:core.tech.length>0,summary:summarise(t),
     evidence:core.tech.filter(x=>big.indexOf(x.tf)>=0).map(x=>({label:x.tf+" trend",impact:x.strength,
       detail:"Price "+(x.vs50||"—")+" the 50 MA, 50 MA "+(x.slope50||"—")+", volatility "+x.volatility+"."}))},
    {key:"structure",strength:st,available:core.struct.some(s=>s.state!=="undefined"),summary:summarise(st),
     evidence:core.struct.filter(x=>big.indexOf(x.tf)>=0).map(x=>({label:x.tf+" structure",impact:x.strength,
       detail:(x.hh?"Higher high":x.lh?"Lower high":"Equal highs")+", "+(x.hl?"higher low":x.ll?"lower low":"equal lows")+
         (x.bos?", "+x.bos+" break of structure":"")+(x.choch?", "+x.choch+" change of character":"")+". State: "+x.state+"."}))},
    {key:"momentum",strength:mo,available:core.momo.length>0,summary:summarise(mo),
     evidence:core.momo.filter(x=>["1D","4H","1H"].indexOf(x.tf)>=0).map(x=>({label:x.tf+" momentum",impact:x.strength,
       detail:"RSI "+(x.rsi!=null?x.rsi.toFixed(1):"—")+", MACD "+(x.macdState||"—")+", 10-bar rate of change "+(x.roc!=null?x.roc.toFixed(2):"—")+"%."}))},
    {key:"news",strength:news.strength,available:news.available,evidence:news.evidence,
     summary:news.available?summarise(news.strength,news.items.length+" related stories in the last 72h"):"No sufficiently relevant news coverage found for this market."},
    {key:"macro",strength:macro.strength,available:macro.available,evidence:macro.drivers,
     summary:macro.available?summarise(macro.strength):"Macro sensitivities not defined for this market."},
    {key:"crossMarket",strength:cross.strength,available:cross.available,evidence:cross.evidence,
     summary:cross.available?summarise(cross.strength):"No cross-market relationships defined."},
    {key:"eventRisk",strength:-eventDamp,available:eventDamp>0,evidence:[],
     summary:eventDamp>0?"Scheduled event risk is reducing conviction.":"No material scheduled event risk."}];
  const notes=["Demo data mode — not live market data"];
  if(!news.available)notes.push("No relevant news coverage");
  return buildScore(cats,conflict,eventDamp,notes);
}
function diffReasons(prev,now){
  const out=[];
  ["1W","1D","4H","1H"].forEach(tf=>{
    const a=prev.tech.find(t=>t.tf===tf), b=now.tech.find(t=>t.tf===tf);
    if(a&&b&&a.vs50&&b.vs50&&a.vs50!==b.vs50)out.push("Price crossed "+b.vs50+" the 50 MA on the "+tf+" chart.");
    const sa=prev.struct.find(s=>s.tf===tf), sb=now.struct.find(s=>s.tf===tf);
    if(sa&&sb&&sa.bias!==sb.bias)out.push(tf+" market structure shifted from "+sa.bias+" to "+sb.bias+".");
    if(sb&&sb.bos&&!(sa&&sa.bos))out.push(tf+" recorded a "+sb.bos+" break of structure.");
  });
  const ma=prev.momo.find(m=>m.tf==="1D"), mb=now.momo.find(m=>m.tf==="1D");
  if(ma&&mb&&ma.macdState&&mb.macdState&&ma.macdState!==mb.macdState)out.push("Daily MACD flipped "+mb.macdState+".");
  return out.slice(0,4);
}
function buildChange(cur,prev,reasons){
  if(!prev)return null;
  const delta=cur.score-prev.score;
  const crossed=(prev.score<45&&cur.score>=60)||(prev.score>55&&cur.score<=40);
  if(crossed||(prev.direction!==cur.direction&&Math.abs(delta)>=8))
    return{kind:"shift",headline:"DIRECTION SHIFT DETECTED",delta:delta,reasons:reasons};
  if(delta<=-10)return{kind:"weakening",headline:(cur.direction==="bearish"?"BEARISH":"BULLISH")+" MOMENTUM WEAKENING",delta:delta,reasons:reasons};
  if(delta>=10)return{kind:"strengthening",headline:(cur.direction==="bearish"?"BEARISH":"BULLISH")+" ALIGNMENT STRENGTHENING",delta:delta,reasons:reasons};
  return{kind:"stable",headline:"Little change since yesterday",delta:delta,reasons:reasons};
}

const analysisCache=new Map();
function analyse(symbol,mode,withPrev){
  const asset=getAsset(symbol); if(!asset)return null;
  const key=symbol+"|"+mode+"|"+(withPrev?1:0)+"|"+Math.floor(Date.now()/(5*MIN));
  if(analysisCache.has(key))return analysisCache.get(key);
  const now=Date.now();
  const ser={}; TFS.forEach(tf=>{ser[tf]=series(asset,tf,now)});
  const core=readCore(ser);
  const quote=quoteFor(asset);
  const news=analyseNews(asset,allNews(now),now);
  const macro=analyseMacro(asset,macroSnapshot(now));
  const ev=analyseEventRisk(asset,allEvents(now),now);
  const cross=analyseCross(asset);
  const score=assemble(mode,core,news,macro,cross,ev.damp);

  let prev=null,reasons=[];
  if(withPrev){
    const ps={}; TFS.forEach(tf=>{ps[tf]=truncate(ser[tf],tf)});
    const pc=readCore(ps);
    const pn=analyseNews(asset,allNews(now).filter(a=>a.publishedAt<=now-DAY),now-DAY);
    const p=assemble(mode,pc,pn,macro,cross,ev.damp);
    prev={score:p.score,direction:p.direction}; reasons=diffReasons(pc,core);
  }
  const out={asset:asset,quote:quote,mode:mode,score:score,tech:core.tech,struct:core.struct,momo:core.momo,
    news:news.items,macro:macroSnapshot(now),macroDrivers:macro.drivers,cross:cross.readings,event:ev,
    momentumScore:Math.round(((weightByMode(core.momo,mode)+1)/2)*100),
    why:buildWhy(asset,score,core.tech,core.struct,ev),
    triggers:buildTriggers(asset,score,core.tech,core.struct,ev),
    previous:prev,change:buildChange(score,prev,reasons),generatedAt:Date.now(),weekly:ser["1W"]};
  analysisCache.set(key,out);
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════════
   MD MOMENTUM MODE
   A configurable model of the higher-timeframe continuation approach: the
   weekly leads, the daily and 4H must not contradict it, the 1H only confirms.
   Every check is a -1..1 reading, NOT a hard rule — the weights decide.
   ═══════════════════════════════════════════════════════════════════════════ */
function mdMomentum(a){
  const T=tf=>a.tech.find(x=>x.tf===tf), S=tf=>a.struct.find(x=>x.tf===tf), M=tf=>a.momo.find(x=>x.tf===tf);
  const wT=T("1W"),wS=S("1W"),dS=S("1D"),fS=S("4H"),oT=T("1H"),oS=S("1H");
  const pw=a.weekly[a.weekly.length-2]; /* the last CLOSED weekly candle */
  const pwR=pw?clamp(((pw.c-pw.o)/((pw.h-pw.l)||1))*2,-1,1):0;
  const maR=(!wT||wT.ma50==null)?0:clamp(((wT.price-wT.ma50)/(wT.atr||wT.price*.02))/3,-1,1);
  const ohR=clamp(((oT&&oT.strength)||0)*.5+((oS&&oS.strength)||0)*.5,-1,1);
  const moR=clamp(((M("1D")&&M("1D").strength)||0)*.6+((M("4H")&&M("4H").strength)||0)*.4,-1,1);
  const nc=a.score.categories.find(c=>c.key==="news");
  const nwR=(nc&&nc.available)?nc.strength:0;
  const word=v=>v>.2?"Bullish":v<-.2?"Bearish":"Neutral";
  const st=v=>v>.2?"bullish":v<-.2?"bearish":"neutral";

  const raw=[
    {k:"weeklyDirection",label:"Weekly Direction",r:(wT&&wT.strength)||0,v:word((wT&&wT.strength)||0),
     d:wT?"Weekly trend read from price versus the 50 and 200 MA and their slopes (50 MA "+(wT.slope50||"—")+").":"Weekly data unavailable."},
    {k:"previousWeeklyCandle",label:"Previous Weekly Candle",r:pwR,v:pw?(pw.c>=pw.o?"Bullish close":"Bearish close"):"Data unavailable",
     d:"The last completed weekly candle. A continuation setup prefers this to agree with the intended direction."},
    {k:"priceVsMa50Weekly",label:"Price vs 50 MA (Weekly)",r:maR,v:(wT&&wT.vs50)?wT.vs50.toUpperCase():"Data unavailable",
     d:"Distance from the weekly 50 MA, measured in ATR so it is comparable across markets."},
    {k:"weeklyStructure",label:"Weekly Structure",r:(wS&&wS.strength)||0,v:word((wS&&wS.strength)||0),
     d:wS?((wS.hh?"Higher high":wS.lh?"Lower high":"Equal highs")+", "+(wS.hl?"higher low":wS.ll?"lower low":"equal lows")+"."):"Weekly structure unavailable."},
    {k:"dailyStructure",label:"Daily Structure",r:(dS&&dS.strength)||0,v:word((dS&&dS.strength)||0),
     d:dS?("State: "+dS.state+"."):"Daily structure unavailable."},
    {k:"fourHourStructure",label:"4H Structure",r:(fS&&fS.strength)||0,v:word((fS&&fS.strength)||0),
     d:fS?("State: "+fS.state+"."):"4H structure unavailable."},
    {k:"oneHourConfirmation",label:"1H Confirmation",r:ohR,v:word(ohR),
     d:"Used only to confirm entry timing — it never overrides the higher timeframes."},
    {k:"momentum",label:"Momentum",r:moR,v:Math.abs(moR)>.45?word(moR)+" — strong":word(moR),
     d:"Daily and 4H RSI, MACD and rate of change combined."},
    {k:"news",label:"News",r:nwR,v:(nc&&nc.available)?word(nwR):"No relevant coverage",
     d:(nc&&nc.available)?"Relevance-weighted news effect for this market.":"No sufficiently relevant news found."}];

  const totalW=Object.keys(MD_RULES).reduce((s,k)=>s+MD_RULES[k],0);
  let weighted=0;
  const checks=raw.map(r=>{
    const w=MD_RULES[r.k], contribution=(r.r*w)/totalW;
    weighted+=contribution;
    return{key:r.k,label:r.label,state:st(r.r),value:r.v,detail:r.d,weight:w,reading:r.r,contribution:contribution*100};
  });
  const score=clamp(Math.round(50+weighted*50),0,100);
  const direction=score>=60?"bullish":score<=40?"bearish":"neutral";
  const sign=Math.sign(weighted||1);
  const aligned=checks.filter(c=>Math.sign(c.reading)===sign&&Math.abs(c.reading)>.2).length;
  return{symbol:a.asset.symbol,name:a.asset.name,score:score,direction:direction,checks:checks,
    aligned:aligned,total:checks.length,
    summary:direction==="neutral"
      ?"Conditions do not currently line up for an MD Momentum continuation setup in either direction."
      :aligned+" of "+checks.length+" MD Momentum checks line up "+direction+". The weekly picture carries the most weight; the 1H is confirmation only."};
}

/* ── universe scan, regime and global direction ────────────────────────── */
const scanCache=new Map();
function scanAll(mode){
  const key=mode+"|"+Math.floor(Date.now()/(5*MIN));
  if(scanCache.has(key))return scanCache.get(key);
  const out=ASSETS.map(a=>analyse(a.symbol,mode,false)).filter(Boolean);
  scanCache.set(key,out); return out;
}
function biasOf(list,sym){const a=list.find(x=>x.asset.symbol===sym);return a?(a.score.score-50)/50:0}
function classifyRegime(list){
  const eqSyms=["SPX","NDX","DJI","RUT","DAX","FTSE","NIKKEI","HSI"];
  const eq=list.filter(a=>eqSyms.indexOf(a.asset.symbol)>=0);
  const eqBias=eq.length?eq.reduce((s,a)=>s+(a.score.score-50)/50,0)/eq.length:0;
  const vix=list.find(a=>a.asset.symbol==="VIX");
  const vixLvl=vix?vix.quote.price:null;
  const gold=biasOf(list,"XAU/USD"), yld=biasOf(list,"US10Y"), usd=biasOf(list,"DXY"), oil=biasOf(list,"WTI");
  const disp=list.length?list.reduce((s,a)=>s+Math.abs(a.score.score-50),0)/list.length:0;
  const atrs=list.map(a=>{const d=a.tech.find(t=>t.tf==="1D");return d?d.atrPct:null}).filter(v=>v!=null);
  const avgAtr=atrs.length?atrs.reduce((a,b)=>a+b,0)/atrs.length:0;

  const secondary=[]; let primary="MIXED";
  if(eqBias>.18&&(vixLvl==null||vixLvl<20))primary="RISK ON";
  else if(eqBias<-.18||(vixLvl!=null&&vixLvl>24))primary="RISK OFF";
  if(disp>22)secondary.push("TRENDING"); else if(disp<11)secondary.push("RANGEBOUND");
  if(vixLvl!=null&&vixLvl>22)secondary.push("HIGH VOLATILITY"); else if(vixLvl!=null&&vixLvl<14)secondary.push("LOW VOLATILITY");
  if(yld>.15&&oil>.1&&gold>0)secondary.push("INFLATIONARY");
  if(yld<-.2&&oil<-.1)secondary.push("DEFLATIONARY");
  if(primary==="MIXED"&&secondary.length)primary=secondary[0];

  const expl=["Equity complex is "+(eqBias>.15?"bid":eqBias<-.15?"offered":"mixed"),
    vixLvl!=null?"VIX at "+vixLvl.toFixed(1):null,
    "the dollar is "+(usd>.12?"firm":usd<-.12?"soft":"range-bound"),
    "yields are "+(yld>.12?"rising":yld<-.12?"easing":"stable"),
    "gold is "+(gold>.12?"supported":gold<-.12?"pressured":"flat")].filter(Boolean).join(", ")+".";
  return{primary:primary,secondary:secondary.filter(s=>s!==primary).slice(0,2),explanation:expl,
    metrics:[{label:"Equity bias",value:eqBias.toFixed(2)},
      {label:"VIX",value:vixLvl!=null?vixLvl.toFixed(2):"Data unavailable"},
      {label:"Dollar bias",value:usd.toFixed(2)},{label:"Yield bias",value:yld.toFixed(2)},
      {label:"Avg daily ATR",value:avgAtr.toFixed(2)+"%"},{label:"Score dispersion",value:disp.toFixed(1)}]};
}
const GLOBAL_GROUPS=["Forex Majors","Stocks","US Indices","Metals","Crypto","Commodities"];
function globalDirection(list){
  /* Macro reference markets (DXY, VIX) are INPUTS to other reads, not markets a
     user is long — they are excluded from the global aggregate. */
  const scored=list.filter(a=>a.asset.group!=="Macro Reference");
  const avg=scored.length?scored.reduce((s,a)=>s+a.score.score,0)/scored.length:50;
  const score=Math.round(avg), band=bandFor(score);
  const groups=GLOBAL_GROUPS.map(g=>{
    const m=scored.filter(a=>a.asset.group===g);
    if(!m.length)return null;
    const gs=Math.round(m.reduce((s,a)=>s+a.score.score,0)/m.length);
    const mixed=m.filter(a=>a.score.direction==="mixed").length/m.length;
    return{group:g,score:gs,count:m.length,direction:mixed>.45?"mixed":bandFor(gs).dir};
  }).filter(Boolean);
  return{direction:band.dir,score:score,label:band.label,groups:groups,
    regime:classifyRegime(list),generatedAt:Date.now()};
}
function radar(list,n){
  const s=list.filter(a=>a.asset.group!=="Macro Reference");
  return{bullish:s.slice().sort((a,b)=>b.score.score-a.score.score).slice(0,n||6),
    bearish:s.slice().sort((a,b)=>a.score.score-b.score.score).slice(0,n||6)};
}
function mostInteresting(list,n){
  return list.filter(a=>a.asset.group!=="Macro Reference").map(a=>{
    const dirs=a.score.categories.filter(c=>c.available&&c.key!=="eventRisk");
    if(!dirs.length)return{a:a,aligned:0};
    const sign=Math.sign(a.score.rawPoints||1);
    return{a:a,aligned:dirs.filter(c=>Math.sign(c.points)===sign&&Math.abs(c.strength)>.15).length};
  }).sort((x,y)=>y.aligned-x.aligned||Math.abs(y.a.score.score-50)-Math.abs(x.a.score.score-50)).slice(0,n||6);
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE ANALYST
   Answers strictly from the structured analysis above. It resolves the question
   to markets, then renders what the engine actually found. It never predicts a
   price, never quotes a probability, and never invents a number.
   ═══════════════════════════════════════════════════════════════════════════ */
const ALIASES={gold:"XAU/USD",xau:"XAU/USD",silver:"XAG/USD",xag:"XAG/USD",bitcoin:"BTC/USD",btc:"BTC/USD",
 ethereum:"ETH/USD",eth:"ETH/USD",solana:"SOL/USD",nasdaq:"NDX","s&p":"SPX","s&p 500":"SPX",sp500:"SPX",spx:"SPX",
 dow:"DJI",russell:"RUT",dax:"DAX",ftse:"FTSE",nikkei:"NIKKEI","hang seng":"HSI",dollar:"DXY","us dollar":"DXY",
 greenback:"DXY",dxy:"DXY",oil:"WTI",crude:"WTI",brent:"BRENT","natural gas":"NATGAS",copper:"COPPER",
 yields:"US10Y","10 year":"US10Y","10y":"US10Y","2 year":"US02Y",vix:"VIX",volatility:"VIX",apple:"AAPL",
 nvidia:"NVDA",tesla:"TSLA",microsoft:"MSFT",amazon:"AMZN",meta:"META",google:"GOOGL",alphabet:"GOOGL",
 euro:"EUR/USD",sterling:"GBP/USD",pound:"GBP/USD",yen:"USD/JPY",cable:"GBP/USD"};
function extractSymbols(q){
  const s=q.toLowerCase(), found=new Set();
  Object.keys(ALIASES).forEach(k=>{if(s.indexOf(k)>=0)found.add(ALIASES[k])});
  ASSETS.forEach(a=>{
    const sym=a.symbol.toLowerCase();
    if(s.indexOf(sym)>=0)found.add(a.symbol);
    else if(sym.indexOf("/")>=0&&s.indexOf(sym.replace("/",""))>=0)found.add(a.symbol);
    else if(s.indexOf(a.name.toLowerCase())>=0)found.add(a.symbol);
  });
  return Array.from(found).slice(0,4);
}
function askAnalyst(question,mode){
  const q=question.toLowerCase();
  const list=scanAll(mode), g=globalDirection(list);
  let syms=extractSymbols(question);
  if(!syms.length)syms=(store.watch||[]).slice(0,3);
  const results=syms.map(s=>analyse(s,mode,true)).filter(Boolean);
  const parts=[];

  if(/strongest|best|most bullish|top/.test(q)){
    const r=radar(list,5);
    parts.push("Strongest bullish alignment right now:");
    parts.push(r.bullish.map(a=>"• "+a.asset.symbol+" — "+a.score.score+" ("+a.score.label+")").join("\n"));
  }else if(/weakest|most bearish|worst/.test(q)){
    const r=radar(list,5);
    parts.push("Weakest markets right now:");
    parts.push(r.bearish.map(a=>"• "+a.asset.symbol+" — "+a.score.score+" ("+a.score.label+")").join("\n"));
  }else if(/event|calendar|today|happening/.test(q)){
    const up=allEvents().filter(e=>e.time>Date.now()).slice(0,6);
    parts.push(up.length?"Next scheduled events:\n"+up.map(e=>"• "+e.name+" ("+e.country+", "+e.importance+" impact) — "+until(e.time)).join("\n")
      :"No scheduled events found in the current calendar window.");
  }else if(/chang|shift|different/.test(q)){
    const moved=results.filter(a=>a.change&&a.change.kind!=="stable");
    parts.push(moved.length?moved.map(a=>"• "+a.asset.symbol+": "+a.change.headline+" ("+(a.change.delta>=0?"+":"")+a.change.delta+" points). "+a.change.reasons.join(" ")).join("\n")
      :"No material direction changes detected in these markets over the last 24 hours.");
  }else if(results.length>=2&&/compare|versus|vs\b/.test(q)){
    parts.push(results.map(a=>a.why).join("\n\n"));
    const top=results.slice().sort((a,b)=>Math.abs(b.score.score-50)-Math.abs(a.score.score-50))[0];
    parts.push(top.asset.symbol+" currently has the stronger directional alignment of the two. That is a comparison of current evidence, not a recommendation.");
  }else if(results.length){
    parts.push(results.map(a=>a.why).join("\n\n"));
    if(results[0].triggers.length)parts.push("What could change it:\n"+results[0].triggers.map(t=>"• "+t).join("\n"));
  }else{
    parts.push("Global market direction is "+g.direction+" with an MD Direction Score of "+g.score+" — "+g.label+". Market regime: "+g.regime.primary+". "+g.regime.explanation);
    parts.push('Ask about a specific market (for example "why is gold bullish?") for a full breakdown.');
  }
  parts.push("Note: this instance runs on clearly-labelled demo data, not live market data.");
  parts.push("This is a directional analysis of current evidence, not a forecast or investment advice.");
  return parts.join("\n\n");
}

/* ═══════════════════════════════════════════════════════════════════════════
   PRESENTATION
   ═══════════════════════════════════════════════════════════════════════════ */
function fmt(v,p){if(v==null||!isFinite(v))return"—";return Number(v).toLocaleString("en-US",{minimumFractionDigits:p==null?2:p,maximumFractionDigits:p==null?2:p})}
function pct(v,d){if(v==null||!isFinite(v))return"—";return(v>=0?"+":"")+v.toFixed(d==null?2:d)+"%"}
function signed(v,d){if(v==null||!isFinite(v))return"—";return(v>=0?"+":"")+v.toFixed(d==null?1:d)}
function ago(ts){if(!ts)return"—";const s=Math.max(0,Math.round((Date.now()-ts)/1000));
  if(s<60)return s+"s ago";const m=Math.round(s/60);if(m<60)return m+"m ago";
  const h=Math.round(m/60);if(h<48)return h+"h ago";return Math.round(h/24)+"d ago"}
function until(ts){const ms=ts-Date.now();if(ms<=0)return"released";const h=ms/HOUR;
  if(h<1)return"in "+Math.round(h*60)+" min";if(h<48)return"in "+Math.round(h)+" h";return"in "+Math.round(h/24)+" days"}
function dtime(ts){return new Date(ts).toISOString().slice(0,16).replace("T"," ")+" UTC"}
function dday(ts){return new Date(ts).toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",timeZone:"UTC"})}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dcls=d=>d==="bullish"?"bull":d==="bearish"?"bear":d==="mixed"?"flat":"mute";
const dbg=d=>d==="bullish"?"var(--bull)":d==="bearish"?"var(--bear)":d==="mixed"?"var(--flat)":"var(--faint)";
const badge=(d,small)=>'<span class="badge b-'+(d==="bullish"?"bull":d==="bearish"?"bear":d==="mixed"?"flat":"none")+'"'+(small?' style="font-size:9px"':'')+'><i></i>'+(d==="mixed"?"MIXED":String(d).toUpperCase())+'</span>';
const impTag=i=>'<span class="tag '+(i==="high"?"hi":i==="medium"?"md":"")+'">'+esc(i)+'</span>';
function meter(score,dir){
  const left=score>=50?50:score, w=Math.abs(score-50);
  return '<div style="display:flex;align-items:center;gap:9px"><div class="meter"><div class="mid"></div>'+
    '<div class="fill" style="left:'+left+'%;width:'+w+'%;background:'+dbg(dir)+'"></div></div>'+
    '<span class="num" style="width:26px;text-align:right;font-family:var(--display);font-weight:700;font-size:14px">'+score+'</span></div>';
}

/* Score dial: a 0-100 gauge. The gold tick at the top marks 50 — the line
   between "no directional evidence" and genuine alignment — and the arc takes
   the direction's colour, so a neutral read never looks like conviction. */
function dial(score,dir,size){
  size=size||200;
  const stroke=Math.max(6,size*.045), r=(size-stroke)/2-2, c=size/2;
  const circ=2*Math.PI*r, arc=(270/360)*circ, prog=clamp(score/100,0,1);
  return '<div style="position:relative;display:inline-flex;flex-direction:column;align-items:center;width:'+size+'px">'+
   '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="MD Direction Score '+score+'">'+
   '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--hair)" stroke-width="'+stroke+'" stroke-dasharray="'+arc+' '+circ+'" transform="rotate(135 '+c+' '+c+')"></circle>'+
   '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+dbg(dir)+'" stroke-width="'+stroke+'" stroke-dasharray="'+(arc*prog)+' '+circ+'" transform="rotate(135 '+c+' '+c+')" style="transition:stroke-dasharray .6s ease"></circle>'+
   '<line x1="'+c+'" y1="'+(c-r-stroke/2-3)+'" x2="'+c+'" y2="'+(c-r+stroke/2+3)+'" stroke="var(--gold)" stroke-width="1.5" opacity=".85"></line>'+
   '</svg>'+
   '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">'+
   '<div class="num" style="font-family:var(--display);font-weight:700;line-height:1;font-size:'+(size*.34)+'px">'+score+'</div>'+
   '<div class="eyebrow" style="margin-top:4px;font-size:'+Math.max(9,size*.05)+'px">MD Score</div></div></div>';
}

/* Evidence breakdown — every score must be explainable. */
function evidenceBlock(score,expandable){
  let h="";
  score.categories.forEach(c=>{
    const fill=clamp(c.fill,0,1);
    const barCol=c.points>.5?"var(--bull)":c.points<-.5?"var(--bear)":"var(--flat)";
    const left=fill>=.5?50:fill*100, w=Math.abs(fill-.5)*100;
    const head='<div class="between" style="align-items:baseline">'+
      '<span style="font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase">'+esc(c.label)+'</span>'+
      '<span class="num small">'+(c.available
        ?'<span class="'+(c.points>=0?"bull":"bear")+'">'+signed(c.points)+'</span><span class="faint"> / '+c.weight+'</span>'
        :'<span class="faint">Data unavailable</span>')+'</span></div>'+
      '<div style="position:relative;height:8px;background:var(--hair-soft);margin-top:6px">'+
        (c.available?'<div style="position:absolute;top:0;bottom:0;left:'+left+'%;width:'+w+'%;background:'+barCol+'"></div><div style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(201,162,39,.5)"></div>':'')+
      '</div>'+
      '<p class="tiny mute" style="margin-top:5px">'+esc(c.summary)+'</p>';
    if(!expandable||!c.evidence.length){h+='<div style="margin-bottom:14px">'+head+'</div>';return}
    h+='<details style="margin-bottom:14px"><summary>'+head+
      '<span class="tiny faint" style="display:inline-block;margin-top:4px;letter-spacing:.13em;text-transform:uppercase">Show evidence ▾</span></summary>'+
      '<ul style="margin:8px 0 0;padding:0 0 0 12px;list-style:none;border-left:1px solid var(--hair)">'+
      c.evidence.map(e=>'<li class="tiny" style="margin-bottom:8px"><div class="between"><span style="font-weight:600">'+esc(e.label)+'</span>'+
        '<span class="num '+(e.impact>=0?"bull":"bear")+'">'+signed(e.impact*10,1)+'</span></div>'+
        '<p class="faint" style="margin-top:2px">'+esc(e.detail)+'</p></li>').join("")+'</ul></details>';
  });
  h+='<div class="rule" style="margin:14px 0"></div><div class="between">'+
    '<span class="eyebrow">Total</span><span class="num" style="font-family:var(--display);font-weight:700;font-size:22px">'+score.score+' <span class="faint" style="font-size:15px">/ 100</span></span></div>'+
    '<div class="flexw" style="margin-top:9px">'+badge(score.direction)+
    '<span class="tag '+(score.quality==="high"?"":"md")+'" style="color:'+(score.quality==="high"?"var(--bull)":score.quality==="medium"?"var(--gold)":"var(--bear)")+'">Evidence '+score.quality+'</span>'+
    '<span class="tiny faint">'+esc(score.qualityReasons.join(" · "))+'</span></div>';
  return h;
}

/* ── per-viewer preferences (a convenience only — never required state) ─── */
const store={mode:"swing",watch:["XAU/USD","EUR/USD","NVDA","BTC/USD"],alerts:[]};
function loadStore(){
  try{
    const raw=localStorage.getItem("md.v1");
    if(raw){const p=JSON.parse(raw);
      if(p.mode&&MODES[p.mode])store.mode=p.mode;
      if(Array.isArray(p.watch))store.watch=p.watch.filter(s=>getAsset(s));
      if(Array.isArray(p.alerts))store.alerts=p.alerts;}
  }catch(e){/* private window, blocked storage — defaults are fine */}
}
function saveStore(){try{localStorage.setItem("md.v1",JSON.stringify(store))}catch(e){}}

/* ═══════════════════════════════════════════════════════════════════════════
   CANDLESTICK CHART — inline SVG. 50/200 MA, volume, structure swing markers
   and high-impact economic-event markers. No charting library.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Chart viewport. `count` is how many bars are on screen and `start` is the
   index of the left-most one, both in bars of the CURRENT timeframe. Pinch and
   wheel change `count`; drag changes `start`. Keeping the viewport in bar
   indices (rather than pixels) means it survives a re-paint and stays correct
   when the series is regenerated. */
const chartState={tf:"1D",ma:true,structure:true,events:true,symbol:null,start:null,count:null};
const MIN_BARS=18;
let chartCalc=null; /* memoised per (symbol, timeframe) so a pinch re-paints in ~2ms */

function chartData(symbol){
  const asset=getAsset(symbol);
  const key=symbol+"|"+chartState.tf+"|"+Math.floor(Date.now()/(5*MIN));
  if(chartCalc&&chartCalc.key===key)return chartCalc;
  const all=series(asset,chartState.tf);
  const closes=all.map(x=>x.c);
  chartCalc={key:key,asset:asset,all:all,m50:sma(closes,50),m200:sma(closes,200),
    swings:findSwings(all,3),
    events:allEvents().filter(e=>e.importance==="high"&&e.time>=all[0].t&&e.time<=all[all.length-1].t+DAY)};
  return chartCalc;
}
function resetViewport(symbol){
  const d=chartData(symbol);
  chartState.symbol=symbol;
  chartState.count=Math.min(d.all.length,chartState.tf==="1W"?120:170);
  chartState.start=d.all.length-chartState.count;
}
function clampViewport(total){
  chartState.count=Math.round(clamp(chartState.count,MIN_BARS,total));
  chartState.start=Math.round(clamp(chartState.start,0,total-chartState.count));
}

function chartScene(symbol){
  const asset=getAsset(symbol); if(!asset)return null;
  if(chartState.symbol!==symbol||chartState.start==null)resetViewport(symbol);
  const d=chartData(symbol);
  clampViewport(d.all.length);
  const s0=chartState.start, n=chartState.count;
  const c=d.all.slice(s0,s0+n);
  const m50=d.m50.slice(s0,s0+n), m200=d.m200.slice(s0,s0+n);
  const swings=d.swings.filter(x=>x.i>=s0&&x.i<s0+n);
  const events=d.events.filter(e=>e.time>=c[0].t&&e.time<=c[c.length-1].t+DAY);

  const W=1000,H=360,padL=6,padR=66,padT=14,padB=20;
  const volH=Math.round(H*.16), priceH=H-padT-padB-volH-8;
  const maVals=chartState.ma?m50.concat(m200).filter(v=>v!=null):[];
  const hi=Math.max.apply(null,c.map(x=>x.h).concat(maVals));
  const lo=Math.min.apply(null,c.map(x=>x.l).concat(maVals));
  const pad=(hi-lo)*.06||hi*.01, top=hi+pad, bot=lo-pad;
  const plotW=W-padL-padR, step=plotW/c.length, bw=Math.max(.8,Math.min(step*.62,26));
  const X=i=>padL+i*step+step/2;
  const Y=p=>padT+((top-p)/((top-bot)||1))*priceH;
  const maxV=Math.max.apply(null,c.map(x=>x.v))||1;
  const VY=v=>padT+priceH+8+volH-(v/maxV)*volH;
  const line=ser=>{let out="",on=false;ser.forEach((v,i)=>{if(v==null){on=false;return}out+=(on?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)+" ";on=true});return out.trim()};

  let svg="";
  for(let i=0;i<5;i++){
    const pr=bot+((top-bot)*i)/4;
    svg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+Y(pr)+'" y2="'+Y(pr)+'" stroke="var(--hair-soft)" stroke-width="1"></line>'+
      '<text x="'+(W-padR+7)+'" y="'+(Y(pr)+3.5)+'" fill="var(--faint)" font-size="10" font-family="var(--mono)">'+fmt(pr,asset.prec)+'</text>';
  }
  c.forEach((x,i)=>{svg+='<rect x="'+(X(i)-bw/2)+'" y="'+VY(x.v)+'" width="'+bw+'" height="'+Math.max(.5,padT+priceH+8+volH-VY(x.v))+'" fill="'+(x.c>=x.o?"var(--bull)":"var(--bear)")+'" opacity=".2"></rect>'});
  c.forEach((x,i)=>{
    const col=x.c>=x.o?"var(--bull)":"var(--bear)", yo=Y(x.o), yc=Y(x.c);
    svg+='<line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+Y(x.h)+'" y2="'+Y(x.l)+'" stroke="'+col+'" stroke-width="1"></line>'+
      '<rect x="'+(X(i)-bw/2)+'" y="'+Math.min(yo,yc)+'" width="'+bw+'" height="'+Math.max(1,Math.abs(yc-yo))+'" fill="'+col+'" opacity=".9"></rect>';
  });
  if(chartState.ma){
    svg+='<path d="'+line(m50)+'" fill="none" stroke="var(--gold)" stroke-width="1.7"></path>'+
      '<path d="'+line(m200)+'" fill="none" stroke="var(--mute)" stroke-width="1.4" stroke-dasharray="4 3"></path>';
  }
  if(chartState.structure){
    swings.forEach(x=>{const i=x.i-s0,y=Y(x.price);
      svg+='<circle cx="'+X(i)+'" cy="'+y+'" r="2.6" fill="var(--bone)" opacity=".8"></circle>'+
        '<text x="'+X(i)+'" y="'+(x.kind==="high"?y-7:y+13)+'" fill="var(--faint)" font-size="9" text-anchor="middle" font-family="var(--mono)">'+(x.kind==="high"?"H":"L")+'</text>'});
  }
  if(chartState.events){
    events.forEach(e=>{
      let best=0,bd=Infinity; c.forEach((x,i)=>{const dd=Math.abs(x.t-e.time);if(dd<bd){bd=dd;best=i}});
      svg+='<line x1="'+X(best)+'" x2="'+X(best)+'" y1="'+padT+'" y2="'+(padT+priceH)+'" stroke="var(--bear)" stroke-width="1" stroke-dasharray="2 4" opacity=".45"></line>'+
        '<rect x="'+(X(best)-3)+'" y="'+padT+'" width="6" height="6" fill="var(--bear)" opacity=".9"></rect>'});
  }
  // Unmissable on the drawing itself, not just in a caption underneath it.
  for(let r=0;r<3;r++){
    for(let k=0;k<3;k++){
      svg+='<text x="'+(120+k*330)+'" y="'+(90+r*110)+'" fill="var(--bear)" opacity="0.13" font-size="34" '+
        'font-family="var(--display)" font-weight="800" letter-spacing="5" text-anchor="middle" '+
        'transform="rotate(-18 '+(120+k*330)+' '+(90+r*110)+')">SAMPLE DATA</text>';
    }
  }
  const label=n+' bars · '+dtime(c[0].t).slice(0,10)+' → '+dtime(c[c.length-1].t).slice(0,10);
  return{inner:svg,label:label,bars:n,symbol:symbol};
}

function chartHTML(symbol){
  const scene=chartScene(symbol); if(!scene)return"";
  const tgl=(k,label,on)=>'<button class="chip" data-chart-toggle="'+k+'" style="padding:4px 8px;font-size:9px;'+(on?"border-color:var(--gold);color:var(--gold)":"")+'">'+label+'</button>';
  const zoomBtn=(act,label,aria)=>'<button class="chip" data-chart-zoom="'+act+'" aria-label="'+aria+'" style="padding:4px 10px;font-size:12px;line-height:1;min-width:32px">'+label+'</button>';

  return '<div class="panel">'+
    '<div class="between" style="flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--hair-soft)">'+
      '<div class="flexw" style="gap:3px">'+TFS.map(t=>'<button class="chip" data-chart-tf="'+t+'" style="padding:5px 10px;font-size:10px;'+(t===chartState.tf?"background:var(--gold);border-color:var(--gold);color:var(--void)":"")+'">'+t+'</button>').join("")+'</div>'+
      '<div class="flexw" style="gap:5px">'+tgl("ma","MA 50/200",chartState.ma)+tgl("structure","Structure",chartState.structure)+tgl("events","Events",chartState.events)+'</div>'+
    '</div>'+
    '<svg id="chartSvg" viewBox="0 0 1000 360" style="width:100%;height:360px;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none" preserveAspectRatio="none" role="img" aria-label="Price chart for '+esc(symbol)+'. Pinch or scroll to zoom, drag to pan.">'+scene.inner+'</svg>'+
    '<div class="between" style="flex-wrap:wrap;gap:8px;padding:8px 14px;border-top:1px solid var(--hair-soft)">'+
      '<div class="flexw" style="gap:5px">'+zoomBtn("out","−","Zoom out")+zoomBtn("in","+","Zoom in")+
        '<button class="chip" data-chart-zoom="reset" style="padding:4px 10px;font-size:9px">Reset</button>'+
        '<span class="num tiny faint" id="chartRange">'+esc(scene.label)+'</span></div>'+
      '<span class="tiny faint" style="letter-spacing:.13em;text-transform:uppercase">Pinch or scroll to zoom · drag to pan</span>'+
    '</div>'+
    '<div class="flexw" style="gap:14px;padding:8px 14px;border-top:1px solid var(--hair-soft);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)">'+
      '<span class="flexw" style="gap:6px"><span style="width:16px;height:1px;background:var(--gold)"></span>50 MA</span>'+
      '<span class="flexw" style="gap:6px"><span style="width:16px;height:1px;background:var(--mute)"></span>200 MA</span>'+
      '<span class="flexw" style="gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--bone)"></span>Swing high / low</span>'+
      '<span class="flexw" style="gap:6px"><span style="width:6px;height:6px;background:var(--bear)"></span>High-impact event</span>'+
      '<span class="bear" style="margin-left:auto;font-weight:700">Simulated prices — will not match your broker</span>'+
    '</div></div>';
}

/* Redraw. `full` rebuilds the panel (timeframe or symbol changed); otherwise only
   the svg's children and the range label are swapped, which keeps the <svg>
   element — and therefore the in-flight pointer capture — alive. */
let chartHost=null, chartPending=false;
function paintChart(full){
  if(!chartState.symbol)return;
  if(full){
    if(!chartHost||!document.body.contains(chartHost))return;
    chartHost.innerHTML=chartHTML(chartState.symbol);
    bindChartGestures();
    return;
  }
  if(chartPending)return;
  chartPending=true;
  requestAnimationFrame(()=>{
    chartPending=false;
    const svg=document.getElementById("chartSvg"); if(!svg)return;
    const scene=chartScene(chartState.symbol); if(!scene)return;
    svg.innerHTML=scene.inner;
    const lab=document.getElementById("chartRange");
    if(lab)lab.textContent=scene.label;
  });
}
function zoomBy(factor,anchorFrac){
  const d=chartData(chartState.symbol), total=d.all.length;
  const anchor=chartState.start+chartState.count*clamp(anchorFrac==null?.5:anchorFrac,0,1);
  const next=clamp(chartState.count*factor,MIN_BARS,total);
  chartState.start=anchor-(anchor-chartState.start)*(next/chartState.count);
  chartState.count=next;
  clampViewport(total);
  paintChart();
}
function panBy(bars){
  const d=chartData(chartState.symbol);
  chartState.start+=bars;
  clampViewport(d.all.length);
  paintChart();
}

/* Pointer Events cover mouse, touch and pen with one code path: one pointer
   pans, two pinch. `touch-action:none` on the SVG stops the browser claiming
   the gesture for page scroll first. */
function bindChartGestures(){
  const svg=document.getElementById("chartSvg"); if(!svg)return;
  const pts=new Map();
  let panFrom=null, pinchFrom=null;
  const spanOf=()=>{const a=Array.from(pts.values());return Math.abs(a[0].x-a[1].x)||1};
  const midFrac=()=>{const a=Array.from(pts.values()),r=svg.getBoundingClientRect();
    return clamp((((a[0].x+a[1].x)/2)-r.left)/r.width,0,1)};

  svg.addEventListener("pointerdown",e=>{
    svg.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){panFrom={x:e.clientX,start:chartState.start};svg.style.cursor="grabbing"}
    else if(pts.size===2){panFrom=null;pinchFrom={span:spanOf(),count:chartState.count,start:chartState.start,frac:midFrac()}}
  });
  svg.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const rect=svg.getBoundingClientRect();
    if(pts.size>=2&&pinchFrom){
      const ratio=pinchFrom.span/spanOf();
      const total=chartData(chartState.symbol).all.length;
      const next=clamp(pinchFrom.count*ratio,MIN_BARS,total);
      const anchor=pinchFrom.start+pinchFrom.count*pinchFrom.frac;
      chartState.start=anchor-(anchor-pinchFrom.start)*(next/pinchFrom.count);
      chartState.count=next;
      clampViewport(total);
      paintChart();
    }else if(panFrom){
      const barsPerPx=chartState.count/rect.width;
      chartState.start=panFrom.start-(e.clientX-panFrom.x)*barsPerPx;
      clampViewport(chartData(chartState.symbol).all.length);
      paintChart();
    }
  });
  const release=e=>{
    pts.delete(e.pointerId);
    if(pts.size<2)pinchFrom=null;
    if(pts.size===0){panFrom=null;svg.style.cursor="grab"}
    else if(pts.size===1){const only=Array.from(pts.values())[0];panFrom={x:only.x,start:chartState.start}}
  };
  svg.addEventListener("pointerup",release);
  svg.addEventListener("pointercancel",release);
  svg.addEventListener("pointerleave",e=>{if(!svg.hasPointerCapture||!svg.hasPointerCapture(e.pointerId))release(e)});
  svg.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=svg.getBoundingClientRect();
    zoomBy(e.deltaY>0?1.16:1/1.16,(e.clientX-r.left)/r.width);
  },{passive:false});
  svg.addEventListener("dblclick",()=>{resetViewport(chartState.symbol);paintChart()});
}

const ui={group:"All",q:"",scan:{direction:"any",min:"0",cls:"any",ma50:"any",structure:"any",momentum:"any",news:"any",event:"any",q:""},
  newsCat:"all",newsImpact:"any",calImp:"any",calCcy:"any",crossFocus:null,momSymbol:null,chat:[]};
function viewMarkets(){
  const list=scanAll(store.mode);
  const groups=["All"].concat(GROUPS);
  const q=ui.q.trim().toUpperCase();
  const rows=list.filter(a=>(ui.group==="All"||a.asset.group===ui.group)&&
    (!q||a.asset.symbol.indexOf(q)>=0||a.asset.name.toUpperCase().indexOf(q)>=0));
  return head("Markets","Every market scored on the same evidence, from the same engine.")+
    '<div style="margin-bottom:14px"><input id="mktSearch" value="'+esc(ui.q)+'" placeholder="Search symbol or name — e.g. XAU, NVDA, GBP/JPY" style="max-width:380px"></div>'+
    '<div class="scroll-x" style="margin-bottom:18px"><div class="flexw" style="flex-wrap:nowrap;gap:5px">'+
      groups.map(g=>'<button class="chip'+(g===ui.group?" on":"")+'" data-group="'+esc(g)+'">'+esc(g)+'</button>').join("")+'</div></div>'+
    (rows.length?'<div class="eyebrow" style="margin-bottom:10px">'+rows.length+' markets</div><div class="grid g4">'+rows.map(marketCard).join("")+'</div>'
      :'<div class="panel" style="padding:44px;text-align:center"><div style="width:38px;height:1px;background:var(--gold);margin:0 auto 10px"></div>'+
       '<h3 style="font-size:15px;text-transform:uppercase;letter-spacing:.02em">No markets match</h3>'+
       '<p class="small mute" style="margin-top:7px">Try a different group or clear the search.</p></div>');
}

  h+='<section class="sect">'+head("What Could Change It","The specific conditions that would alter this read.")+

  return h;
}

/* ── Scanner ───────────────────────────────────────────────────────────── */
const SCAN_FIELDS=[
 ["direction","Direction",["any","bullish","bearish","neutral","mixed"]],
 ["min","Minimum score",["0","50","60","70","80","90"]],
 ["cls","Asset class",["any","forex","stock","crypto","index","commodity","metal","etf","bond"]],
 ["ma50","Price vs 50 MA",["any","above","below"]],
 ["structure","Structure",["any","bullish","bearish","neutral"]],
 ["momentum","Momentum",["any","strong","moderate","weak"]],
 ["news","News",["any","bullish","bearish","neutral"]],
 ["event","Event risk",["any","none","low","medium","high"]]];
function scanRow(a){
  const d=a.tech.find(t=>t.tf==="1D"), s=a.struct.find(x=>x.tf==="1D");
  const nc=a.score.categories.find(c=>c.key==="news");
  return{a:a,ma50:d&&d.vs50?d.vs50:null,structure:s?s.bias:"neutral",
    momentum:a.momentumScore>=68||a.momentumScore<=32?"strong":a.momentumScore>=57||a.momentumScore<=43?"moderate":"weak",
    news:!nc||!nc.available?"neutral":nc.strength>.12?"bullish":nc.strength<-.12?"bearish":"neutral",
    event:a.event.risk};
}
function viewScanner(){
  const f=ui.scan, q=f.q.trim().toUpperCase();
  const rows=scanAll(store.mode).map(scanRow).filter(r=>{
    const a=r.a;
    if(f.direction!=="any"&&a.score.direction!==f.direction)return false;
    /* A minimum-score filter is symmetric: it means "at least this strong", in
       whichever direction the market leans. */
    if(f.min!=="0"&&Math.max(a.score.score,100-a.score.score)<Number(f.min))return false;
    if(f.cls!=="any"&&a.asset.cls!==f.cls)return false;
    if(f.ma50!=="any"&&r.ma50!==f.ma50)return false;
    if(f.structure!=="any"&&r.structure!==f.structure)return false;
    if(f.momentum!=="any"&&r.momentum!==f.momentum)return false;
    if(f.news!=="any"&&r.news!==f.news)return false;
    if(f.event!=="any"&&r.event!==f.event)return false;
    if(q&&a.asset.symbol.indexOf(q)<0&&a.asset.name.toUpperCase().indexOf(q)<0)return false;
    return true;
  }).sort((x,y)=>Math.abs(y.a.score.score-50)-Math.abs(x.a.score.score-50));

  return head("Market Scanner","Rank every market by evidence alignment, then narrow it with the filters that matter to you.")+
   '<div class="panel" style="padding:15px;margin-bottom:16px">'+
    '<div style="display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+
    '<div><div class="eyebrow" style="margin-bottom:4px">Search</div><input id="scanQ" value="'+esc(f.q)+'" placeholder="Symbol or name"></div>'+
    SCAN_FIELDS.map(fl=>'<div><div class="eyebrow" style="margin-bottom:4px">'+fl[1]+'</div><select data-scan="'+fl[0]+'">'+
      fl[2].map(o=>'<option value="'+o+'"'+(f[fl[0]]===o?" selected":"")+' style="text-transform:capitalize">'+(fl[0]==="min"?(o==="0"?"Any":o+"+"):o)+'</option>').join("")+
      '</select></div>').join("")+'</div>'+
    '<p class="tiny faint" style="margin-top:11px">“Minimum score” is symmetric: it filters on strength of alignment in either direction, so a score of 18 passes an 80+ filter as strong bearish alignment.</p>'+
   '</div>'+
   (rows.length?'<div class="panel scroll-x"><table><thead><tr>'+
     ["Market","Price","Change","MD Score","Direction","50 MA","Structure","Momentum","News","Event risk"].map(x=>'<th>'+x+'</th>').join("")+
     '</tr></thead><tbody>'+rows.map(r=>{const a=r.a;return '<tr>'+
      '<td><a href="#/market/'+encodeURIComponent(a.asset.symbol)+'"><span style="display:block;font-family:var(--display);font-weight:600;font-size:13px">'+esc(a.asset.symbol)+'</span>'+
      '<span class="tiny faint" style="letter-spacing:.13em;text-transform:uppercase">'+esc(a.asset.group)+'</span></a></td>'+
      '<td class="num small">'+fmt(a.quote.price,a.asset.prec)+'</td>'+
      '<td class="num small '+(a.quote.changePct>=0?"bull":"bear")+'">'+pct(a.quote.changePct)+'</td>'+
      '<td style="min-width:118px">'+meter(a.score.score,a.score.direction)+'</td>'+
      '<td>'+badge(a.score.direction,true)+'</td>'+
      '<td class="small '+(r.ma50==="above"?"bull":r.ma50==="below"?"bear":"faint")+'" style="text-transform:uppercase">'+(r.ma50||"—")+'</td>'+
      '<td class="small '+dcls(r.structure)+'" style="text-transform:uppercase">'+r.structure+'</td>'+
      '<td class="small mute" style="text-transform:uppercase">'+r.momentum+'</td>'+
      '<td class="small '+dcls(r.news)+'" style="text-transform:uppercase">'+r.news+'</td>'+
      '<td class="small '+(r.event==="high"?"bear":r.event==="medium"?"gold":"faint")+'" style="text-transform:uppercase">'+r.event+'</td></tr>'}).join("")+
     '</tbody></table></div><div class="between tiny faint" style="margin-top:10px;letter-spacing:.13em;text-transform:uppercase"><span>'+rows.length+' results</span><span>Demo data · updated '+ago(Date.now())+'</span></div>'
    :'<div class="panel" style="padding:40px;text-align:center"><h3 style="font-size:15px;text-transform:uppercase">No markets match these filters</h3>'+
     '<p class="small mute" style="margin-top:7px">Loosen a filter — most useful setups do not satisfy every condition at once.</p></div>');
}

/* ── Cross-market map ──────────────────────────────────────────────────── */
const MAP_SYMS=["DXY","XAU/USD","US10Y","SPX","NDX","WTI","BTC/USD","VIX","EUR/USD","USD/JPY","COPPER","XAG/USD"];
function viewCross(){
  const nodes=MAP_SYMS.map(s=>{const a=getAsset(s);return a?{s:s,name:a.name,bias:trendBias(s)}:null}).filter(Boolean);
  const edges=[];
  MAP_SYMS.forEach(s=>{const a=getAsset(s);if(!a)return;
    a.rel.forEach(r=>{if(MAP_SYMS.indexOf(r.symbol)>=0)edges.push({from:s,to:r.symbol,sign:r.sign})})});
  const W=820,H=470,cx=W/2,cy=H/2,R=Math.min(W,H)/2-64;
  const pos={};
  nodes.forEach((n,i)=>{const ang=(i/nodes.length)*Math.PI*2-Math.PI/2;pos[n.s]={x:cx+Math.cos(ang)*R,y:cy+Math.sin(ang)*R}});
  const focus=ui.crossFocus;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-height:470px;display:block">';
  edges.forEach(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
    const on=focus===e.from||focus===e.to;
    svg+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+(e.sign===1?"var(--bull)":"var(--bear)")+'" stroke-width="'+(on?1.9:.8)+'" opacity="'+(focus?(on?.75:.09):.26)+'"></line>'});
  nodes.forEach(n=>{const p=pos[n.s],b=n.bias||0;
    const col=b>.15?"var(--bull)":b<-.15?"var(--bear)":"var(--flat)", on=focus===n.s;
    svg+='<g data-cross="'+esc(n.s)+'" style="cursor:pointer">'+

/* ── How it works ──────────────────────────────────────────────────────── */
function viewAbout(){
  const rows=CAT_ORDER.map(k=>[CAT_LABEL[k],WEIGHTS[k],{
    technical:"Price vs the 50 and 200 MA, MA slopes, extension from the mean, volatility regime",
    structure:"Higher highs / higher lows, break of structure, change of character, consolidation",
    momentum:"RSI, MACD histogram, 10-bar rate of change, volume relative to its own average",
    news:"Theme-classified stories mapped onto this asset's own relationship to each theme",
    macro:"Dollar, real yields, risk appetite, inflation, growth and rate expectations, weighted by the asset's betas",
    crossMarket:"Directional confirmation from related markets, with the sign of each relationship applied",
    eventRisk:"Scheduled releases this asset is actually exposed to, weighted by impact and proximity"}[k]]);
  return head("How it works","The whole model, written out. Nothing about the score is hidden.")+
  '<div class="panel" style="padding:20px;margin-bottom:18px">'+
   '<div class="eyebrow" style="margin-bottom:9px">The MD Direction Score</div>'+
   '<p class="small mute" style="max-width:68ch">Each category produces a signed strength between −1 and +1. Multiplied by its weight it contributes signed points, and the sum maps onto the 0–100 scale as <span class="num gold">score = 50 + points / 2</span>. A market with no directional evidence therefore sits at 50 — "Mixed / Neutral" — and perfect alignment reaches 0 or 100.</p>'+
   '<p class="small mute" style="margin-top:11px;max-width:68ch">The score measures <span style="color:var(--bone)">how strongly the available evidence lines up</span>. It is not a probability, and nothing in this product presents it as one. A score of 87 means strong bullish alignment right now — not an 87% chance of anything.</p>'+
   '<div class="scroll-x" style="margin-top:18px"><table><thead><tr><th>Category</th><th>Weight</th><th>What it reads</th></tr></thead><tbody>'+
   rows.map(r=>'<tr><td class="small" style="font-weight:600">'+esc(r[0])+'</td><td class="num small gold">'+r[1]+'</td><td class="small mute" style="white-space:normal;min-width:280px">'+esc(r[2])+'</td></tr>').join("")+
   '</tbody></table></div></div>'+
  '<div class="grid g2" style="gap:16px;margin-bottom:18px">'+
   ['<b>Event risk pulls toward neutral, not bearish.</b> A scheduled binary event can resolve either way, so it removes conviction from whichever direction the rest of the evidence points — and only for markets actually exposed to that release.',
    '<b>Conflict detection.</b> If higher and lower timeframes disagree — or if the higher timeframes disagree with <i>each other</i> — the market is reported MIXED, the score is pulled toward neutral, and the disagreement is named in plain English.',
    '<b>Evidence quality is separate from the score.</b> A score of 84 backed by four of seven categories is not the same claim as 84 backed by all seven, so the two are never merged into one number.',
    '<b>Calibration.</b> Trend and structure swing near ±1 when a market trends; news, macro and cross-market are weighted averages and rarely exceed ~0.4 raw. Each passes through a monotonic curve that fixes 0→0 and ±1→±1, so it can never change a category\'s direction.',
    '<b>Missing data is reported as missing.</b> When a category has nothing to say the engine marks it unavailable rather than inventing a reading, and the evidence-quality rating drops accordingly.',
    '<b>These are not real prices.</b> Every price, headline and calendar entry in this build is generated by an algorithm running in your browser. There is no market data feed behind it. The numbers will not match OANDA, forex.com, TradingView or any broker, because they are not derived from any market. This build exists to test the analysis engine and the interface — never to make a trading decision.'
   ].map(t=>'<div class="panel" style="padding:15px"><p class="small mute" style="line-height:1.6">'+t+'</p></div>').join("")+'</div>'+
  '<div class="panel" style="padding:20px">'+
   '<div class="eyebrow" style="margin-bottom:9px">Disclaimer</div>'+
   '<p class="small mute" style="max-width:74ch">MD Market Direction provides market analysis and educational information. Directional scores are algorithmic assessments of available market data and are not guarantees of future performance or investment advice. Markets can move unexpectedly, and users are responsible for their own trading and investment decisions.</p></div>';
}

    else if(route==="calendar")html=viewCalendar();
    else if(route==="momentum")html=viewMomentum();
    else if(route==="cross")html=viewCross();

document.addEventListener("click",function(e){
  const t=e.target.closest("[data-group],[data-scan],[data-newscat],[data-why],[data-watch],[data-alert],"+
    "[data-chart-tf],[data-chart-toggle],[data-chart-zoom],[data-mom],[data-mom-back],[data-cross],[data-watch-add],[data-watch-del],"+
    "[data-alert-del],[data-alert-save],[data-modal-close],[data-modal-bg],[data-ask],[data-send]");
  if(!t)return;
  const d=t.dataset;
  if(d.modalClose!==undefined||(d.modalBg!==undefined&&e.target===t)){closeModal();if(d.modalClose!==undefined&&t.tagName!=="A")return;}
  if(d.group!==undefined){ui.group=d.group;render();return}
  if(d.newscat!==undefined){ui.newsCat=d.newscat;render();return}
  if(d.why!==undefined){whyModal(d.why);return}
  if(d.alert!==undefined){alertModal(d.alert);return}
  if(d.alertSave!==undefined){saveAlert(d.alertSave);return}
  if(d.alertDel!==undefined){store.alerts.splice(Number(d.alertDel),1);saveStore();render();return}
  if(d.watch!==undefined){
    const i=store.watch.indexOf(d.watch);
    if(i>=0)store.watch.splice(i,1); else store.watch.push(d.watch);
    saveStore();render();return}
  if(d.watchAdd!==undefined){
    const el=document.getElementById("watchAdd"), sym=(el.value||"").trim().toUpperCase();
    const a=getAsset(sym);
    if(a&&store.watch.indexOf(a.symbol)<0){store.watch.push(a.symbol);saveStore();render()}
    else if(!a){el.value="";el.placeholder="Not in the universe — try XAU/USD, NVDA, SPX"}
    return}
  if(d.watchDel!==undefined){
    const i=store.watch.indexOf(d.watchDel); if(i>=0)store.watch.splice(i,1); saveStore();render();return}
  if(d.chartTf!==undefined){chartState.tf=d.chartTf;resetViewport(chartState.symbol);paintChart(true);return}
  if(d.chartToggle!==undefined){chartState[d.chartToggle]=!chartState[d.chartToggle];paintChart(true);return}
  if(d.chartZoom!==undefined){if(d.chartZoom==="in")zoomBy(1/1.4);else if(d.chartZoom==="out")zoomBy(1.4);else resetViewport(chartState.symbol);paintChart();return}
  if(d.mom!==undefined){ui.momSymbol=d.mom;render();return}
  if(d.momBack!==undefined){ui.momSymbol=null;render();return}
  if(d.cross!==undefined){ui.crossFocus=ui.crossFocus===d.cross?null:d.cross;render();return}
  if(d.ask!==undefined){ask(d.ask);return}
  if(d.send!==undefined){const el=document.getElementById("chatInput");ask(el.value);return}
});
document.addEventListener("change",function(e){
  const t=e.target;
  if(t.id==="modeSelect"||t.id==="modeSelectMobile"){setMode(t.value);return}
  if(t.dataset.scan!==undefined){ui.scan[t.dataset.scan]=t.value;render();return}
  if(t.dataset.newsimpact!==undefined){ui.newsImpact=t.value;render();return}
  if(t.dataset.cal!==undefined){if(t.dataset.cal==="imp")ui.calImp=t.value;else ui.calCcy=t.value;render();return}
});
document.addEventListener("input",function(e){
  const t=e.target;
  if(t.id==="mktSearch"){ui.q=t.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();const el=document.getElementById("mktSearch");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},260)}
  if(t.id==="scanQ"){ui.scan.q=t.value;clearTimeout(window._q2);window._q2=setTimeout(()=>{render();const el=document.getElementById("scanQ");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},260)}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target.id==="chatInput"){ask(e.target.value)}
  if(e.target.id==="watchAdd"){
    const sym=(e.target.value||"").trim().toUpperCase(), a=getAsset(sym);
    if(a&&store.watch.indexOf(a.symbol)<0){store.watch.push(a.symbol);saveStore();render()}}
  if(e.key==="Escape")closeModal();
});
window.addEventListener("hashchange",render);

/* ── boot ──────────────────────────────────────────────────────────────── */
function boot(){
  loadStore();
  renderNav();
  const view=document.getElementById("view");
  view.innerHTML='<div style="padding:70px 0;text-align:center">'+
    '<div style="width:44px;height:44px;border:1px solid rgba(201,162,39,.4);margin:0 auto 18px;display:flex;align-items:center;justify-content:center" class="dot">'+
    '<span style="width:14px;height:14px;background:var(--gold)"></span></div>'+
    '<div class="eyebrow">Analysing '+ASSETS.length+' markets across 6 timeframes</div>'+
    '<p class="small mute" style="margin-top:9px">Building trend, structure, momentum, news, macro, cross-market and event-risk readings.</p></div>';
  /* Give the browser one frame to paint the loading state before the scan. */
  requestAnimationFrame(()=>setTimeout(()=>{
    if(!location.hash)location.hash="#/dashboard";
    render();
  },30));
}
boot();
</script>

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
