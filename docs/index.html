<style>
/* ───────────────────────────────────────────────────────────────────────────
   MD MARKET DIRECTION
   A deliberately single-theme design: this is a trading terminal, and a
   terminal is dark. Every colour is painted explicitly so the page holds on
   either host ground rather than borrowing it.
   ─────────────────────────────────────────────────────────────────────────── */
:root{
  --void:#08080b; --ink:#0c0c11; --panel:#101016; --panel-2:#15151d;
  --hair:#23232e; --hair-soft:#1a1a22;
  --bone:#f4f4f2; --mute:#9a9aa6; --faint:#6a6a78;
  --gold:#c9a227; --gold-hi:#e6c55c; --gold-dim:#5f4c13;
  --bull:#3dd68c; --bear:#f0574e; --flat:#c2a64e;
  --display:'Montserrat',ui-sans-serif,system-ui,sans-serif;
  --body:'Open Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --rail:236px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--bone)}
body{margin:0;font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{background:var(--ink);border:1px solid var(--hair);color:var(--bone);font-family:var(--body);font-size:13px;padding:8px 10px;border-radius:0;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
option{background:var(--ink)}
::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hair)}
*{scrollbar-width:thin;scrollbar-color:var(--hair) transparent}

/* ── type utilities ─────────────────────────────────────────────────────── */
.eyebrow{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .faint{color:var(--faint)}
.bull{color:var(--bull)} .bear{color:var(--bear)} .flat{color:var(--flat)} .gold{color:var(--gold)}
.small{font-size:12px} .tiny{font-size:11px}

/* ── surfaces ───────────────────────────────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--hair-soft)}
.goldline{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rule{height:1px;background:var(--hair)}

/* ── shell ──────────────────────────────────────────────────────────────── */
.shell{display:flex;min-height:100%}
.rail{position:sticky;top:0;height:100vh;width:var(--rail);flex:0 0 var(--rail);background:var(--ink);border-right:1px solid var(--hair-soft);display:flex;flex-direction:column}
.rail-top{padding:18px 20px;border-bottom:1px solid var(--hair-soft)}
.rail-nav{flex:1;overflow-y:auto;padding:14px 10px}
.rail-foot{padding:14px 20px;border-top:1px solid var(--hair-soft)}
.navgroup{margin-bottom:18px}
.navgroup .eyebrow{padding:0 8px 8px}
.navlink{display:flex;align-items:center;gap:11px;padding:8px;color:var(--mute);font-size:13px;transition:color .15s,background .15s}
.navlink:hover{background:var(--panel);color:var(--bone)}
.navlink.on{background:var(--panel-2);color:var(--gold)}
.navlink svg{flex:0 0 17px;opacity:.8}
.navlink .tick{margin-left:auto;width:2px;height:15px;background:var(--gold)}
.main{flex:1;min-width:0;padding:22px 24px 40px}
.wrap{max-width:1180px;margin:0 auto}
.topbar{display:none}
.tabbar{display:none}

@media (max-width:1023px){
  .rail{display:none}
  .main{padding:16px 16px 92px}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;background:rgba(12,12,17,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair-soft)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(12,12,17,.97);backdrop-filter:blur(10px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-family:var(--display);font-weight:600}
  .tabbar a.on{color:var(--gold)}
}

/* ── demo banner ────────────────────────────────────────────────────────── */
.demobar{background:rgba(240,87,78,.14);border-bottom:1px solid rgba(240,87,78,.45);padding:8px 16px;text-align:center}
.demobar span{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bear)}

/* ── components ─────────────────────────────────────────────────────────── */
.sect{margin-bottom:34px}
.secthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:14px}
.secthead>div{min-width:0}
.secthead h2{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.secthead p{margin-top:4px;font-size:13px;color:var(--mute);max-width:64ch}

.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid;padding:2px 7px;font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.badge i{width:6px;height:6px;display:block}
.b-bull{border-color:rgba(61,214,140,.42);color:var(--bull);background:rgba(61,214,140,.09)} .b-bull i{background:var(--bull)}
.b-bear{border-color:rgba(240,87,78,.42);color:var(--bear);background:rgba(240,87,78,.09)} .b-bear i{background:var(--bear)}
.b-flat{border-color:rgba(194,166,78,.42);color:var(--flat);background:rgba(194,166,78,.09)} .b-flat i{background:var(--flat)}
.b-none{border-color:var(--hair);color:var(--mute)} .b-none i{background:var(--faint)}

.tag{border:1px solid var(--hair);padding:2px 6px;font-family:var(--display);font-weight:600;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tag.hi{border-color:rgba(240,87,78,.45);color:var(--bear);background:rgba(240,87,78,.08)}
.tag.md{border-color:rgba(201,162,39,.45);color:var(--gold);background:rgba(201,162,39,.08)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.15em;text-transform:uppercase;transition:background .15s,border-color .15s,color .15s}
.btn-gold{background:var(--gold);color:var(--void)}
.btn-gold:hover{background:var(--gold-hi)}
.btn-ghost{border:1px solid var(--hair);color:var(--mute)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip{border:1px solid var(--hair);padding:6px 12px;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--void)}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g4{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.g3,.g2{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

.mcard{display:block;padding:15px;transition:border-color .15s}
.mcard:hover{border-color:rgba(201,162,39,.45)}
.mcard .sym{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.mcard dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:12px 0 0;padding-top:11px;border-top:1px solid var(--hair-soft);font-size:11px}
.mcard dt{color:var(--faint)} .mcard dd{margin:0;text-align:right;font-weight:600}

.meter{height:6px;background:var(--hair-soft);position:relative;flex:1}
.meter .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(201,162,39,.65)}
.meter .fill{position:absolute;top:0;bottom:0;transition:width .5s ease,left .5s ease}

.rowlink{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair-soft);transition:background .15s}
.rowlink:last-child{border-bottom:none}
.rowlink:hover{background:var(--panel-2)}
.rowlink .stripe{width:2px;height:24px;flex:0 0 2px}
.rowlink>a,.rowlink>span{min-width:0}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--display);font-weight:600;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);text-align:left;padding:9px 11px;border-bottom:1px solid var(--hair);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--hair-soft);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
.scroll-x{overflow-x:auto}

details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}

.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(8,8,11,.84);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--hair);max-width:640px;width:100%;max-height:86vh;overflow-y:auto}
@media (max-width:640px){.modal-bg{align-items:flex-end;padding:0}.modal{max-height:92vh}}

.skel{background:linear-gradient(90deg,#13131a 25%,#1d1d27 37%,#13131a 63%);background-size:200% 100%;animation:sh 1.4s ease infinite}
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
.dot{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.fade{animation:fu .4s ease both}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.skel,.dot,.fade,.meter .fill{animation:none;transition:none}}

.flexw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
</style>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   MD MARKET DIRECTION — analysis engine
   Everything below runs in the browser. There is no server: the demo data
   generator, the indicator stack, the scoring engine and the explanation
   engine are all client-side, which is why this page works from a link alone.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── deterministic randomness ──────────────────────────────────────────── */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function rng(seed){let a=typeof seed==="string"?hashStr(seed):seed>>>0;return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function gauss(next){let u=0,v=0;while(u===0)u=next();while(v===0)v=next();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const squash=(v,s)=>(!isFinite(v)||!s)?0:Math.tanh(v/s);

/* ── indicators ────────────────────────────────────────────────────────── */
function sma(v,p){const o=new Array(v.length).fill(null);let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=p)s-=v[i-p];if(i>=p-1)o[i]=s/p}return o}
function ema(v,p){const o=new Array(v.length).fill(null);const k=2/(p+1);let prev=null,s=0;
  for(let i=0;i<v.length;i++){if(i<p-1){s+=v[i];continue}if(prev===null){s+=v[i];prev=s/p}else{prev=v[i]*k+prev*(1-k)}o[i]=prev}return o}
function rsi(v,p){const o=new Array(v.length).fill(null);if(v.length<=p)return o;let g=0,l=0;
  for(let i=1;i<=p;i++){const d=v[i]-v[i-1];if(d>=0)g+=d;else l-=d}
  let ag=g/p,al=l/p;o[p]=al===0?100:100-100/(1+ag/al);
  for(let i=p+1;i<v.length;i++){const d=v[i]-v[i-1];ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;o[i]=al===0?100:100-100/(1+ag/al)}
  return o}
function macd(v,f,sl,sg){f=f||12;sl=sl||26;sg=sg||9;
  const fe=ema(v,f),se=ema(v,sl);
  const line=v.map((_,i)=>(fe[i]!==null&&se[i]!==null)?fe[i]-se[i]:null);
  const compact=line.filter(x=>x!==null);const sigC=ema(compact,sg);
  const signal=new Array(v.length).fill(null);let j=0;
  for(let i=0;i<v.length;i++){if(line[i]!==null){signal[i]=sigC[j];j++}}
  const hist=v.map((_,i)=>(line[i]!==null&&signal[i]!==null)?line[i]-signal[i]:null);
  return{macd:line,signal:signal,hist:hist}}
function atr(c,p){const o=new Array(c.length).fill(null);if(c.length<=p)return o;
  const tr=c.map((x,i)=>{if(i===0)return x.h-x.l;const pc=c[i-1].c;return Math.max(x.h-x.l,Math.abs(x.h-pc),Math.abs(x.l-pc))});
  let s=0;for(let i=1;i<=p;i++)s+=tr[i];let prev=s/p;o[p]=prev;
  for(let i=p+1;i<c.length;i++){prev=(prev*(p-1)+tr[i])/p;o[i]=prev}return o}
function roc(v,p){return v.map((x,i)=>(i>=p&&v[i-p]!==0)?((x-v[i-p])/v[i-p])*100:null)}

/* ═══════════════════════════════════════════════════════════════════════════
   THE ASSET UNIVERSE
   Each asset carries the metadata the engine reasons over:
     macro  — how it responds to each macro factor (-1..1)
     news   — how it responds to each news THEME (this is the news→market map)
     tags   — which economic events it is actually exposed to
     rel    — cross-market relationships, with the sign of the relationship
   ═══════════════════════════════════════════════════════════════════════════ */
const US=["fed","us-inflation","us-jobs","us-growth"];
const ASSETS=[];
function A(symbol,name,cls,group,prec,price,vol,bias,macro,news,tags,rel,ccy,sector){
  ASSETS.push({symbol,name,cls,group,prec,price,vol,bias,
    macro:Object.assign({dollar:0,realYields:0,riskAppetite:0,inflation:0,growth:0,rates:0},macro),
    news:news||{},tags:tags||[],
    rel:(rel||[]).map(r=>({symbol:r[0],sign:r[1],weight:r[2],label:r[3]})),
    ccy:ccy||[],sector:sector||null});
}

/* Forex majors */
A("EUR/USD","Euro / US Dollar","forex","Forex Majors",5,1.0842,.07,.18,
  {dollar:-.95,rates:-.5,realYields:-.45,growth:.25,riskAppetite:.2},
  {"rates-hawkish":-.8,dollar:-.95,"central-bank-ecb":.75,"growth-strong":-.3,"risk-sentiment":.25},
  US.concat(["ecb","eu-inflation"]),[["DXY",-1,1,"Dollar index"],["XAU/USD",1,.4,"Gold"],["US10Y",-1,.5,"US 10Y yield"]],["EUR","USD"]);
A("GBP/USD","British Pound / US Dollar","forex","Forex Majors",5,1.2718,.08,.12,
  {dollar:-.9,rates:-.45,realYields:-.4,growth:.3,riskAppetite:.3},
  {"rates-hawkish":-.75,dollar:-.9,"central-bank-boe":.75,"risk-sentiment":.3},
  US.concat(["boe","uk-inflation"]),[["DXY",-1,1,"Dollar index"],["EUR/USD",1,.7,"Euro"],["GBP/JPY",1,.5,"Sterling cross"]],["GBP","USD"]);
A("USD/JPY","US Dollar / Japanese Yen","forex","Forex Majors",3,151.42,.09,-.22,
  {dollar:.85,rates:.8,realYields:.85,riskAppetite:.4,growth:.3},
  {"rates-hawkish":.85,dollar:.9,"central-bank-boj":-.9,"risk-sentiment":.4,geopolitics:-.4},
  US.concat(["boj"]),[["US10Y",1,.9,"US 10Y yield"],["DXY",1,.8,"Dollar index"],["XAU/USD",-1,.35,"Gold"]],["USD","JPY"]);
A("USD/CHF","US Dollar / Swiss Franc","forex","Forex Majors",5,.8964,.07,-.1,
  {dollar:.85,rates:.6,realYields:.6,riskAppetite:.35},
  {"rates-hawkish":.7,dollar:.85,geopolitics:-.6,"risk-sentiment":.35},
  US,[["DXY",1,.9,"Dollar index"],["XAU/USD",-1,.4,"Gold"]],["USD","CHF"]);
A("AUD/USD","Australian Dollar / US Dollar","forex","Forex Majors",5,.6592,.09,.14,
  {dollar:-.85,riskAppetite:.7,growth:.6,inflation:.2},
  {dollar:-.85,"china-growth":.8,"risk-sentiment":.7,"rates-hawkish":-.6},
  US.concat(["china"]),[["HSI",1,.5,"China proxy"],["COPPER",1,.6,"Copper"],["DXY",-1,.9,"Dollar index"]],["AUD","USD"]);
A("USD/CAD","US Dollar / Canadian Dollar","forex","Forex Majors",5,1.3588,.07,-.16,
  {dollar:.8,riskAppetite:-.4,growth:-.3,rates:.4},
  {dollar:.8,"oil-supply":-.7,"rates-hawkish":.6},
  US.concat(["oil"]),[["WTI",-1,.8,"Crude oil"],["DXY",1,.85,"Dollar index"]],["USD","CAD"]);
A("NZD/USD","New Zealand Dollar / US Dollar","forex","Forex Majors",5,.6088,.09,.08,
  {dollar:-.85,riskAppetite:.7,growth:.55},
  {dollar:-.85,"china-growth":.7,"risk-sentiment":.7,"rates-hawkish":-.6},
  US.concat(["china"]),[["AUD/USD",1,.9,"Aussie dollar"],["DXY",-1,.85,"Dollar index"]],["NZD","USD"]);
/* Forex crosses */
A("EUR/JPY","Euro / Japanese Yen","forex","Forex Crosses",3,164.18,.09,.3,
  {riskAppetite:.65,rates:.4,growth:.4,realYields:.4},
  {"risk-sentiment":.7,"central-bank-boj":-.85,"central-bank-ecb":.7,geopolitics:-.5},
  ["ecb","boj","eu-inflation"],[["USD/JPY",1,.8,"Yen weakness"],["DAX",1,.5,"European equities"]],["EUR","JPY"]);
A("GBP/JPY","British Pound / Japanese Yen","forex","Forex Crosses",3,192.56,.11,.42,
  {riskAppetite:.75,rates:.45,growth:.45,realYields:.45},
  {"risk-sentiment":.8,"central-bank-boj":-.85,"central-bank-boe":.7,geopolitics:-.55},
  ["boe","boj","uk-inflation"],[["USD/JPY",1,.85,"Yen weakness"],["SPX",1,.5,"Global risk appetite"],["GBP/USD",1,.5,"Sterling"]],["GBP","JPY"]);

/* Categories do not share a natural scale. Trend and structure swing near ±1
   when a market trends; news, macro and cross-market are weighted AVERAGES of
   signed inputs and rarely exceed ~0.4 raw. Each is passed through a signed

   category's direction or manufacture conviction at the extremes. */
const CALIBRATION={technical:.85,structure:.85,momentum:.7,news:.6,macro:.65,crossMarket:.7,eventRisk:1};

/* ═══════════════════════════════════════════════════════════════════════════
   DEMO PRICE SERIES
   Deterministic. Every timeframe is driven by the SAME wall-clock trend cycles,
   so weekly / daily / 4H structure genuinely lines up — and shorter cycles
   genuinely create the higher/lower timeframe conflicts the detector catches.
   This is clearly-labelled synthetic data. It is never presented as live.
   ═══════════════════════════════════════════════════════════════════════════ */
const MIN=60000,HOUR=3600000,DAY=86400000,YEAR=365*DAY;
const TF_MS={"5M":5*MIN,"15M":15*MIN,"1H":HOUR,"4H":4*HOUR,"1D":DAY,"1W":7*DAY};
const TF_BARS={"5M":500,"15M":500,"1H":600,"4H":600,"1D":900,"1W":320};
const CYCLES=[{d:210,a:1},{d:47,a:.6},{d:11,a:.22},{d:2.3,a:.12}];
const TREND=4.2,NOISE=.78;

const seriesCache=new Map();
function series(asset,tf,now){
  now=now||Date.now();
  const bars=TF_BARS[tf], iv=TF_MS[tf];
  const bucket=Math.floor(now/(5*MIN));
  const key=asset.symbol+"|"+tf+"|"+bucket;
  const hit=seriesCache.get(key); if(hit)return hit;

  const end=Math.floor(now/iv)*iv, start=end-(bars-1)*iv;
  const dayB=Math.floor(now/DAY);
  const ph=rng(asset.symbol+":phase:"+dayB);
  const phases=CYCLES.map(()=>ph()*Math.PI*2);
  const next=rng(asset.symbol+"|"+tf+"|"+dayB);
  const dt=iv/YEAR, sigma=asset.vol*Math.sqrt(dt)*NOISE;

  const path=new Array(bars); let x=0;
  for(let i=0;i<bars;i++){
    const t=start+i*iv; let cyc=0;
    for(let k=0;k<CYCLES.length;k++)cyc+=CYCLES[k].a*Math.sin((2*Math.PI*t)/(CYCLES[k].d*DAY)+phases[k]);
    const mu=(asset.bias*.9+cyc)*asset.vol*TREND*dt;
    x+=mu+sigma*gauss(next); path[i]=x;
  }
  const wander=1+(rng(asset.symbol+"|anchor|"+dayB)()-.5)*.05;
  const scale=(asset.price*wander)/Math.exp(path[bars-1]);

  const vs=rng(asset.symbol+"|vol|"+tf+"|"+dayB);
  const out=new Array(bars);
  for(let i=0;i<bars;i++){
    const c=Math.exp(path[i])*scale;
    const o=i===0?c*(1-sigma*.4):out[i-1].c;
    const range=Math.abs(c-o)+c*sigma*(.55+vs()*.9);
    const hi=Math.max(o,c)+range*vs()*.55, lo=Math.min(o,c)-range*vs()*.55;
    const move=Math.abs(c-o)/(c*sigma||1);
    out[i]={t:start+i*iv,o:o,h:hi,l:lo,c:c,v:Math.round(1e6*(1+asset.vol)*(.6+vs()*.8)*(1+move*.45))};
  }
  /* A small smooth "live" tick so the latest bar moves between refreshes
     without rewriting history. */
  const tick=(hashStr(asset.symbol+"|tick|"+bucket)/4294967296-.5)*2;
  const last=out[bars-1];
  last.c=last.c+tick*last.c*sigma*.8;
  last.h=Math.max(last.h,last.c); last.l=Math.min(last.l,last.c);

  seriesCache.set(key,out);
  if(seriesCache.size>700){const k0=seriesCache.keys().next().value;seriesCache.delete(k0)}
  return out;
}
function quoteFor(asset){
  const d=series(asset,"1D"); const t=d[d.length-1], p=d[d.length-2];
  const prev=p?p.c:t.o;
  return{symbol:asset.symbol,price:t.c,change:t.c-prev,changePct:prev?((t.c-prev)/prev)*100:0,
    dayHigh:t.h,dayLow:t.l,prevClose:prev,volume:t.v,timestamp:Date.now(),source:"MD Demo Engine",demo:true};
}

/* ═══════════════════════════════════════════════════════════════════════════
   MACRO — a slowly wandering but deterministic macro picture. The SAME state
   drives the news generator, so headlines and the macro panel always tell a
   consistent story, exactly as a real trading day does.
   ═══════════════════════════════════════════════════════════════════════════ */
const MACRO_FACTORS=["policyStance","inflation","growth","dollar","realYields","riskAppetite"];
let _narr=null,_narrDay=null;
function narrative(now){
  now=now||Date.now(); const d=Math.floor(now/DAY);
  if(_narr&&_narrDay===d)return _narr;
  const n={};
  MACRO_FACTORS.forEach(f=>{
    const s=rng("macro:"+f), phase=s()*Math.PI*2;

  n.riskAppetite=clamp(n.riskAppetite*.6-n.policyStance*.25+n.growth*.15,-1,1);
